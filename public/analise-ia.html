<style>
:root{--g900:#122418;--g700:#623a10;--g600:#7c4a14;--g500:#7c4a14;--g400:#a05f1a;--gvivid:#2ee06a;--gwash:#f6f0e9;--ink:#13261a;--mut:#83786c;--line:#eae8e6;
--or:#f0830f;--or-vivid:#ff911b;--or-deep:#d9750a;--or-wash:#feefde;--or-line:#f7d3ad;--or-glow:rgba(240,131,15,.5);
--wa-head:#8c5112;--wa-head2:#3d3328;--ease-out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(130% 90% at 50% 0%,#f3ede7,#f5f7f4);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:14px 12px;min-height:100dvh}

/* ===== Popup (janela do chat) ===== */
.app{width:100%;max-width:410px;height:calc(100dvh - 28px);max-height:880px;display:flex;flex-direction:column;background:#e5ddd5;overflow:hidden;border-radius:22px;border:1px solid rgba(124,74,20,.14);box-shadow:0 30px 60px -26px rgba(18,36,24,.4),0 0 0 1px rgba(124,74,20,.08)}

/* ===== Header (consultora) ===== */
.wa-top{position:relative;z-index:20;background:linear-gradient(135deg,var(--wa-head),var(--wa-head2));color:#fff;display:flex;align-items:center;gap:11px;padding:12px 14px}
.wa-top::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 90% 0%,rgba(46,224,106,.35),transparent 55%)}
.wa-top .bk{opacity:.9;display:flex;position:relative;z-index:1}
.wa-top .av{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.4);background:#162e1f}
.wa-top .av img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.wa-top .who{flex:1;min-width:0;position:relative;z-index:1}
.wa-top .nm{font-size:15px;font-weight:800;line-height:1.15;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.wa-top .nm .verif{display:inline-flex;flex-shrink:0}
.wa-top .st{font-size:11.5px;color:#d3efe3;display:flex;align-items:center;gap:5px;height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.wa-top .st i{width:7px;height:7px;border-radius:50%;background:#2ee06a;display:inline-block;flex-shrink:0;box-shadow:0 0 8px #2ee06a}
.wa-top .st.typing{color:#f9f4ef;font-style:italic}
.wa-top .ic{margin-left:auto;display:flex;gap:16px;opacity:.9;position:relative;z-index:1}
.wa-prog{height:4px;background:rgba(0,0,0,.16);position:relative;z-index:20}
.wa-prog i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--g400),var(--or-vivid));transition:width .5s var(--ease-out);box-shadow:0 0 10px rgba(255,145,27,.5)}
.chan-note{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;background:#fff3e6;border-bottom:1px solid rgba(0,0,0,.05);color:#6b5e50;font-size:11px;line-height:1.35;text-align:center;position:relative;z-index:19}
.chan-note svg{flex-shrink:0}
.chan-note b{color:#7a4d1c;font-weight:800}

/* ===== Palco das perguntas ===== */
/* A THREAD é o que rola, não cada tela. Antes cada etapa era uma .qpage
   'position:absolute' que ocupava a janela inteira e era DESTRUÍDA na etapa
   seguinte — por isso a conversa sumia e recomeçava. Agora as etapas
   empilham uma embaixo da outra dentro do .stage, como no WhatsApp. */
.stage{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#e7ded4 url("images/wa-bg.svg") repeat;background-size:320px;padding:14px 0 20px}
.qpage{position:relative;display:flex;flex-direction:column;padding:4px 14px;overflow:visible}
.qpage>*{flex-shrink:0}
.qpage.enter{animation:slideIn .34s cubic-bezier(.22,.9,.31,1) both}
/* etapa já respondida continua visível, mas não clicável (evita responder 2x) */
.qpage.past{pointer-events:none}
/* Os botões de opção escondem com opacity:0 — ou seja, continuam ocupando
   altura. Como a etapa antiga não é mais destruída, isso deixava um buraco
   enorme no meio da conversa. Em etapa já respondida eles saem do layout. */
.qpage.past .opts{display:none}
.qpage.past{padding-bottom:0}
.qpage.leave{animation:slideOut .26s ease both;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-30px)}}

/* mensagens da Fernanda */
.qtop{display:flex;flex-direction:column;gap:8px;margin-bottom:auto}
.qrow{display:flex;gap:8px;align-items:flex-end;animation:pop .3s ease both}
.qrow .mav{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1px solid rgba(0,0,0,.06);background:#162e1f;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qrow .mav img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.qrow .mav.ghost{visibility:hidden}
.bubble{max-width:84%;padding:11px 14px;border-radius:16px;border-bottom-left-radius:5px;font-size:15px;line-height:1.5;background:#fff;color:#14291c;box-shadow:0 2px 6px -2px rgba(20,41,28,.18)}
.bubble.q{font-weight:600;font-size:16.5px;line-height:1.45}
.bubble b{font-weight:800;color:var(--g600)}
.bubble.typing-b{padding:13px 15px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* indicador de digitação */
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:7px;height:7px;border-radius:50%;background:#c1beba;animation:ty 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes ty{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* mensagem de voz */
.voice{display:flex;align-items:center;gap:10px;min-width:210px;max-width:280px}
.voice .play{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--g500);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.voice .wave{flex:1;display:flex;align-items:center;gap:2.5px;height:26px}
.voice .wave i{flex:1;background:#e6c9a9;border-radius:2px;height:30%}
.voice .wave i.on{background:var(--g500)}
.voice .meta{display:flex;flex-direction:column;gap:3px;min-width:34px}
.voice .meta .t{font-size:11px;color:#7c808a;font-weight:600}

/* botões de resposta */
.opts{display:flex;flex-direction:column;gap:10px;padding-top:16px;margin-top:14px;opacity:0;transform:translateY(10px);transition:opacity .32s ease,transform .32s ease;pointer-events:none}
.opts.show{opacity:1;transform:none;pointer-events:auto}
.opt{background:#fff;border:1.5px solid #e6dbcf;color:var(--g700);font-family:inherit;font-size:15px;font-weight:700;padding:15px 16px;border-radius:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:11px;box-shadow:0 4px 12px -6px rgba(20,41,28,.35);transition:.15s var(--ease-out)}
.opt:hover{border-color:var(--g500);background:#faf7f3;transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--g500);background:#f7f2ed;box-shadow:0 0 0 2px rgba(124,74,20,.2)}
.opt:disabled{opacity:.55;cursor:default}
.opt .em{font-size:19px;line-height:1}
.opt span.lbl{flex:1}
.opt .ar{margin-left:auto;color:var(--g400);display:flex}

/* campo de digitação */
.chat-input{display:flex;gap:9px;padding-top:16px;margin-top:14px;opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
.chat-input.show{opacity:1;transform:none;pointer-events:auto}
.chat-input input{flex:1;min-width:0;border:1.5px solid #e6dbcf;border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;background:#fff;color:#14291c;outline:none;box-shadow:0 3px 10px -6px rgba(20,41,28,.3)}
.chat-input input:focus{border-color:var(--g500)}
.chat-input input::placeholder{color:#afa79f}
.chat-input button{width:52px;flex-shrink:0;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g400),var(--g600));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(124,74,20,.6)}
.chat-input button:active{transform:scale(.96)}

/* página de "analisando" */
/* min-height no lugar de height:100%: as telas agora empilham na thread,
   e 100% de um pai de altura automática colapsaria o bloco */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:18px;text-align:center;padding:24px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(124,74,20,.16);border-top-color:var(--g500);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.analyzing .at{font-size:16px;font-weight:800;color:var(--g700)}
.analyzing .as{font-size:13px;color:#69635d}

/* ===== Oferta ===== */
.offer{background:#fff;border-radius:20px;box-shadow:0 22px 50px -22px rgba(20,41,28,.5);overflow:hidden;animation:pop .4s ease both;margin-top:14px}
.offer .oh{position:relative;background:radial-gradient(120% 90% at 85% 0%,var(--g400),transparent 55%),linear-gradient(135deg,var(--g700),var(--g500));color:#fff;padding:20px;text-align:center;overflow:hidden}
.offer .oh .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:100px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.offer .oh .ttl{font-size:13px;color:#ecdecf;margin-top:12px}
.offer .oh .big{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:2px;color:#fff}
.offer .oh .sub{font-size:12px;color:#e9dac9;margin-top:4px}
.offer .ob{padding:18px}
.offer .sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.offer .sld-top .l{font-size:12px;color:var(--mut);font-weight:600}
.offer .sld-top .v{font-size:22px;font-weight:900;color:var(--g700);letter-spacing:-.5px}
.offer input[type=range]{-webkit-appearance:none;width:100%;height:9px;border-radius:6px;background:#ece8e3;outline:none;margin:10px 0 6px}
.offer input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid var(--g500);box-shadow:0 0 0 5px rgba(124,74,20,.14),0 6px 14px -4px rgba(124,74,20,.5);cursor:pointer}
.offer input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid var(--g500);cursor:pointer}
.offer .sld-lab{display:flex;justify-content:space-between;font-size:11px;color:#d7a875;font-weight:600}
.offer .parc{background:var(--gwash);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.offer .parc .pl{font-size:12px;color:var(--mut)}.offer .parc .pv{font-size:17px;font-weight:800;color:var(--ink)}
.offer .obtn{position:relative;width:100%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:16px;border-radius:14px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden;box-shadow:0 16px 30px -10px var(--or-glow);animation:breathe 2.4s ease-in-out infinite}
.offer .obtn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none;animation:btnShine 3.2s var(--ease-out) infinite}
@keyframes btnShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes breathe{0%,100%{box-shadow:0 14px 26px -10px var(--or-glow)}50%{box-shadow:0 20px 40px -8px rgba(240,131,15,.65)}}
.offer .obtn:active{transform:scale(.98)}
.offer .sec{text-align:center;font-size:11px;color:var(--mut);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== NOVA OFERTA: valor + parcelas + resumo ===== */
.vcard,.pgrid,.summary{margin-top:8px}
.vcard{position:relative;background:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 20px 46px -20px rgba(20,41,28,.55);animation:pop .4s ease both;overflow:hidden}
.vcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g500),var(--g400) 55%,var(--or-vivid))}
.vc-pill{display:inline-flex;align-items:center;gap:6px;background:#f7f2ed;color:var(--g700);border:1px solid #ecdecf;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:5px 11px;border-radius:100px}
.vc-label{font-size:13px;color:#69635d;font-weight:700;margin-top:15px}
.vc-amount{display:flex;align-items:baseline;gap:7px;margin-top:3px;color:var(--g700)}
.vc-amount .cur{font-size:21px;font-weight:800}
.vc-amount #vAmt{font-size:48px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.vc-sub{font-size:12px;color:#7c808a;margin-top:5px}
.vc-range{-webkit-appearance:none;width:100%;height:9px;border-radius:6px;background:#ece8e3;outline:none;margin:20px 0 6px}
.vc-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--g500);box-shadow:0 0 0 5px rgba(124,74,20,.14),0 6px 14px -4px rgba(124,74,20,.5);cursor:pointer}
.vc-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--g500);cursor:pointer}
.vc-limits{display:flex;justify-content:space-between;font-size:11px;color:#d7a875;font-weight:700}
.vc-chips{display:flex;gap:8px;margin-top:14px}
.vc-chip{flex:1;border:1.5px solid #e6ddd3;background:#fcfaf8;color:var(--g700);font-family:inherit;font-weight:700;font-size:12.5px;padding:9px 4px;border-radius:11px;cursor:pointer;transition:.15s}
.vc-chip:hover{border-color:var(--g500)}
.vc-chip.on{background:var(--g500);color:#fff;border-color:var(--g500)}

.cta{position:relative;width:100%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:17px;border-radius:15px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden;box-shadow:0 16px 30px -12px var(--or-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none;animation:btnShine 3.2s var(--ease-out) infinite}
.cta:active{transform:scale(.985)}
.cta.breathe{animation:breathe 2.4s ease-in-out infinite}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pcard{position:relative;background:#fff;border:1.6px solid #eae3db;border-radius:15px;padding:16px 13px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s var(--ease-out);box-shadow:0 6px 16px -10px rgba(20,41,28,.5)}
.pcard:hover{border-color:var(--g500);transform:translateY(-3px)}
.pcard:active{transform:scale(.985)}
.pcard.pop{border-color:var(--or);background:#fff8f1;box-shadow:0 12px 26px -10px rgba(240,131,15,.45)}
.pc-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-size:9px;font-weight:800;letter-spacing:.3px;padding:3px 9px;border-radius:100px;text-transform:uppercase;box-shadow:0 6px 14px -5px var(--or-glow)}
.pc-n{font-size:24px;font-weight:900;color:var(--g700);letter-spacing:-.5px}
.pcard.pop .pc-n{color:var(--or-deep)}
.pc-val{font-size:15px;font-weight:800;color:#14291c;margin-top:3px}
.pc-val span{font-size:11px;font-weight:600;color:#8a8e97}
.pc-total{font-size:11px;color:#8a8e97;margin-top:5px}

.summary{background:#fff;border-radius:20px;padding:16px;box-shadow:0 20px 46px -20px rgba(20,41,28,.55);animation:pop .4s ease both}
.sm-amount{position:relative;background:radial-gradient(120% 90% at 85% 0%,var(--g400),transparent 55%),linear-gradient(135deg,var(--g700),var(--g500));color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:6px;overflow:hidden}
.sm-amount .l{font-size:11px;color:#ecdecf;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.sm-amount .v{font-size:35px;font-weight:900;letter-spacing:-1px;margin-top:2px}
.sm-amount .s{font-size:11.5px;color:#e9dac9;margin-top:2px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f3f2f0}
.srow .si{width:36px;height:36px;border-radius:11px;background:#f7f2ed;color:var(--g600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow .sl{font-size:12.5px;color:#7c808a;font-weight:600;flex:1}
.srow .sv{font-size:14px;color:#14291c;font-weight:700;text-align:right}
.srow .sv b{font-weight:900;color:var(--g700)}
.srow .sv small{display:block;font-size:10.5px;color:#a5a19c;font-weight:600;margin-top:1px}
.s-sec{text-align:center;font-size:11px;color:var(--mut);margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== Assinatura ===== */
.signcard{position:relative;background:#fff;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 20px 46px -20px rgba(20,41,28,.55);animation:pop .4s ease both;overflow:hidden}
.signcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g500),var(--g400) 55%,var(--or-vivid))}
.sign-h{font-weight:800;color:var(--g700);font-size:16px;display:flex;align-items:center;gap:7px}
.sign-sub{font-size:12px;color:#7c808a;margin:3px 0 12px}
.sign-pad{position:relative;border:2px dashed #e3d8cd;border-radius:14px;background:#fdfbf9;height:175px;overflow:hidden;transition:border-color .2s}
.sign-pad.bad{border-color:#ef4444;background:#fef2f2}
.sign-pad::after{content:"assine aqui";position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#cac4be;pointer-events:none;letter-spacing:.5px}
.sign-pad.inked::after{display:none}
.sign-pad canvas{position:relative;z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sign-clear{position:absolute;z-index:3;top:8px;right:8px;background:#f5f2ee;border:1px solid #e6ddd3;color:var(--g700);font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer}
.sign-name{width:100%;border:1.5px solid #e6ddd3;border-radius:12px;padding:13px 14px;font-family:inherit;font-size:15px;margin-top:12px;outline:none;color:#14291c}
.sign-name:focus{border-color:var(--g500)}
.sign-name.bad{border-color:#ef4444}

/* ===== Documento do contrato ===== */
.contract{background:#fff;border-radius:16px;padding:18px 16px;margin-top:12px;border:1px solid #ecedee;box-shadow:0 20px 46px -20px rgba(20,41,28,.55);animation:pop .4s ease both;color:#2f2d2a}
.contract .doc-top{text-align:center;border-bottom:1.5px solid #f1f0ee;padding-bottom:10px;margin-bottom:10px}
.contract .doc-top h3{font-size:13.5px;color:var(--g700);letter-spacing:.3px}
.contract .doc-top .ds{font-size:10px;color:#8a8e97;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.contract .field{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #f1f0ee;font-size:12.5px}
.contract .field .k{color:#7c808a}
.contract .field .v{font-weight:700;color:#14291c;text-align:right}
.contract .terms{font-size:10.5px;line-height:1.65;color:#69635d;margin-top:11px}
.contract .terms b{color:#14291c}
.contract .sigblock{margin-top:14px;text-align:center}
.contract .sigblock img{height:74px;max-width:78%;object-fit:contain;display:block;margin:0 auto -6px}
.contract .sigline{border-top:1.6px solid #14291c;width:72%;margin:0 auto 5px}
.contract .signame{font-weight:800;color:#14291c;font-size:13px}
.contract .sigmeta{font-size:10px;color:#8a8e97;margin-top:2px}
.contract .stamp{position:relative;margin-top:12px;text-align:center}
.contract .stamp span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--g500);color:var(--g500);font-weight:800;font-size:10.5px;letter-spacing:.6px;padding:4px 12px;border-radius:8px;transform:rotate(-4deg);opacity:.9}

/* ===== Confirmar termos ===== */
.term-wrap{margin-top:14px}
.term-check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#14291c;background:#fff;border:1.5px solid #e6ddd3;border-radius:13px;padding:14px;cursor:pointer}
.term-check input{width:21px;height:21px;flex-shrink:0;accent-color:var(--g500)}
.term-check.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important}}

/* ============================================================
   IDENTIDADE CREDFÁCIL — upgrade visual da conversa da Fernanda
   ============================================================ */
:root{--gold:#d99041;--gold-d:#b9752c;--gold-soft:#f6dcc0}

/* moldura da janela um pouco mais "produto" */
.app{border:1px solid rgba(18,36,24,.16);box-shadow:0 34px 70px -28px rgba(18,36,24,.5),0 0 0 1px rgba(217,144,65,.14)}

/* ===== Barra de marca institucional (acima da consultora) ===== */
.brandbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(180deg,#0f2015,#122418);border-bottom:1px solid rgba(217,144,65,.3);position:relative;z-index:21}
.brandbar .bb-logo{height:20px;width:auto;opacity:.98}
.brandbar .bb-div{width:1px;height:15px;background:rgba(255,255,255,.18)}
.brandbar .bb-tag{font-size:11px;font-weight:700;letter-spacing:.2px;color:#e5d3c0}
.brandbar .bb-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#ffd2a1}
.brandbar .bb-live i{width:7px;height:7px;border-radius:50%;background:#ff911b;box-shadow:0 0 0 0 rgba(255,145,27,.7);animation:cfbPulse2 1.6s infinite}
@keyframes cfbPulse2{0%{box-shadow:0 0 0 0 rgba(255,145,27,.6)}70%{box-shadow:0 0 0 7px rgba(255,145,27,0)}100%{box-shadow:0 0 0 0 rgba(255,145,27,0)}}

/* ===== Consultora — institucional (verde profundo + anel dourado) ===== */
.wa-top{background:linear-gradient(135deg,#8c5112,#3d3328)}
.wa-top .av{border-color:rgba(217,144,65,.55)}
.wa-top .av-on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#2ee06a;border:2px solid #122418;z-index:2}
.wa-top .nm{font-size:15.5px}
.wa-top .st{color:#e5d3c0}
.wa-top .ic{align-items:center}
.wa-top .sec-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#ffd9b0;background:rgba(217,144,65,.16);border:1px solid rgba(217,144,65,.42);padding:6px 11px;border-radius:100px;white-space:nowrap}
.wa-top .sec-tag svg{width:12px;height:12px}

/* progresso com toque dourado */
.wa-prog i{background:linear-gradient(90deg,var(--g400),var(--gold) 58%,var(--or-vivid))}

/* ===== Balões da Fernanda ===== */
.bubble{border-radius:18px;border-bottom-left-radius:6px;box-shadow:0 3px 10px -4px rgba(20,41,28,.2);border:1px solid rgba(20,41,28,.05)}
.bubble.q{background:linear-gradient(180deg,#ffffff,#faf8f5);border-color:rgba(124,74,20,.14)}
.qrow .mav{border:1.5px solid rgba(217,144,65,.5)}

/* ===== BOTÕES DE RESPOSTA — cards de produto CredFácil ===== */
.opt{border:1.5px solid #e7e1db;border-radius:16px;padding:13px 14px;gap:13px;background:#fff;box-shadow:0 6px 16px -10px rgba(20,41,28,.4);transition:.18s var(--ease-out)}
.opt .em{font-size:20px;width:42px;height:42px;min-width:42px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f7f2ed,#f2e8de);border:1px solid #e6dbcf;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.opt span.lbl{font-size:15px;font-weight:700;color:#173121}
.opt .ar{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#f8f5f2;color:var(--g600);display:flex;align-items:center;justify-content:center;transition:.18s var(--ease-out)}
.opt:hover{border-color:var(--g500);background:#fefdfb;transform:translateY(-2px);box-shadow:0 13px 24px -12px rgba(124,74,20,.45)}
.opt:hover .ar{background:var(--g600);color:#fff}
.opt.sel{border-color:var(--gold);background:#fffbf7;box-shadow:0 0 0 2px rgba(217,144,65,.38),0 10px 22px -12px rgba(217,144,65,.5)}
.opt.sel .em{background:linear-gradient(160deg,#fbe4cb,#f4d2ae);border-color:var(--gold)}
.opt.sel .ar{background:var(--gold);color:#fff}

/* botão "continuar" (intro/recap) — ação primária sólida da marca */
.opt#contBtn{justify-content:center;background:linear-gradient(135deg,#362d24,#122418);border-color:#122418;box-shadow:0 12px 24px -12px rgba(18,36,24,.6)}
.opt#contBtn span.lbl{color:#fff;flex:0 0 auto}
.opt#contBtn .ar{margin-left:8px;background:rgba(255,255,255,.16);color:#fff}
.opt#contBtn:hover{transform:translateY(-2px);background:linear-gradient(135deg,#3f352a,#162d1e)}
.opt#contBtn:hover .ar{background:rgba(255,255,255,.28);color:#fff}

/* ===== Cartão de confirmação de identidade (consulta CPF) ===== */
.idcard{margin-top:12px;background:#fff;border:1px solid #e9e6e2;border-radius:18px;padding:14px 16px;box-shadow:0 16px 40px -20px rgba(20,41,28,.5);animation:pop .4s ease both;overflow:hidden}
.idcard .id-head{margin:0 -16px 6px;padding:0 16px 12px;border-bottom:1px solid #f2f0ee}
.idcard .id-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--g700);background:#f7f2ed;border:1px solid #ecdecf;padding:6px 11px;border-radius:100px}
.idcard .id-badge svg{width:13px;height:13px}
.idcard .id-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed #f2f0ee;font-size:13px}
.idcard .id-row:last-of-type{border-bottom:0}
.idcard .id-k{color:#7c808a;font-weight:600;flex-shrink:0}
.idcard .id-v{color:#14291c;font-weight:700;text-align:right;word-break:break-word}
.idcard .id-v.ok{color:var(--g600)}
.idcard .id-foot{margin-top:12px;font-size:10.5px;color:#a5a19c;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.idcard .id-foot svg{width:11px;height:11px;stroke:#a5a19c;flex-shrink:0}

/* ===== Formulário de endereço (carnê) ===== */
.addrcard{margin-top:12px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 18px 44px -20px rgba(20,41,28,.5);animation:pop .4s ease both;border:1px solid #e9e6e2}
.addr-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--g700);font-size:15px}
.addr-sub{font-size:12px;color:#7c808a;margin:4px 0 13px;line-height:1.4}
.addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr-field{display:flex;flex-direction:column;gap:5px}
.addr-field.full{grid-column:1 / -1}
.addr-field label{font-size:11px;font-weight:700;color:#69635d;padding-left:2px}
.addr-field input{border:1.5px solid #e6ddd3;border-radius:12px;padding:12px 13px;font-family:inherit;font-size:14.5px;color:#14291c;outline:none;background:#fff;width:100%}
.addr-field input:focus{border-color:var(--g500);box-shadow:0 0 0 3px rgba(124,74,20,.1)}
.addr-field input.bad{border-color:#ef4444;background:#fef2f2}
.addr-cep-msg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;min-height:15px;margin-top:1px}

/* ============================================================
   WHATSAPP AUTÊNTICO — camada final de override
   Faz a tela parecer o WhatsApp de verdade (topo, papel de parede,
   balões com rabinho + horário, respostas em balão verde, barra de digitar).
   Os cartões de oferta continuam com a identidade dourada da CredFácil
   (leem como "mensagens de template" da conta comercial).
   ============================================================ */
:root{
  --wa-green:#075e54; --wa-green-d:#054c44; --wa-teal:#128c7e;
  --wa-send:#00a884; --wa-check:#25d366;
  --wa-out:#d9fdd3; --wa-in:#ffffff; --wa-tick:#53bdeb;
  --wa-time:#667781; --wa-wall:#e4dcd4;
  --wa-enc-bg:#fde4c9; --wa-enc-tx:#5b4e40; --wa-foot:#f0f2f5;
}
/* moldura: menos "cartão", mais tela de celular */
.app{border-radius:28px !important;background:var(--wa-wall) !important;
  border:1px solid rgba(4,40,34,.18) !important;
  box-shadow:0 42px 84px -30px rgba(4,40,34,.55),0 0 0 1px rgba(0,0,0,.05) !important}

/* ===== barra de status do celular ===== */
.brandbar{display:none !important}
.phone-status{display:flex;align-items:center;justify-content:space-between;
  background:var(--wa-green);color:#fff;padding:7px 18px 5px;position:relative;z-index:23;
  font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.2px}
.phone-status .ps-r{display:flex;align-items:center;gap:6px}
.phone-status svg{display:block}

/* ===== header do WhatsApp ===== */
.wa-top{background:var(--wa-green) !important;color:#fff;gap:8px;padding:6px 10px 8px !important;align-items:center}
.wa-top::after{display:none !important}
.wa-top .bk{opacity:1;margin:0 -2px 0 0;padding:2px}
.wa-top .av{width:40px !important;height:40px !important;border:0 !important;background:#0a5b51 !important}
.wa-top .av-on{display:none !important}
.wa-top .who{margin-left:1px}
.wa-top .nm{font-size:16px !important;font-weight:600 !important;color:#fff}
.wa-top .nm .verif svg path:first-child{fill:var(--wa-check)}
.wa-top .st{font-size:12.5px !important;color:#cfe9df !important}
.wa-top .st i{display:none !important}
.wa-top .st.typing{color:#a7e9cf !important;font-style:normal !important;font-weight:500}
.wa-top .ic{gap:20px !important;align-items:center;color:#fff;opacity:.97}
.wa-top .ic .sec-tag{display:none !important}
.wa-top .ic svg{width:22px;height:22px}

/* progresso discreto e verde */
.wa-prog{height:3px !important;background:rgba(0,0,0,.14) !important}
.wa-prog i{background:linear-gradient(90deg,var(--wa-teal),var(--wa-send)) !important;box-shadow:none !important}

/* aviso de criptografia (amarelinho característico) */
.chan-note{background:var(--wa-enc-bg) !important;color:var(--wa-enc-tx) !important;
  border-bottom:0 !important;font-size:10.6px !important;padding:6px 22px !important;line-height:1.35}
.chan-note b{color:#3d3124 !important}
.chan-note svg path{fill:#ca873f !important}

/* faixa de conta verificada — cartão limpo (selo verde + texto) */
.official-bar{display:flex;align-items:center;gap:11px;padding:9px 15px;
  background:#f4faf7;border-bottom:1px solid #e4efe8;position:relative;z-index:19}
.official-bar .ob-badge{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#2ee06a,#12a150);
  box-shadow:0 4px 10px -3px rgba(18,161,80,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.official-bar .ob-badge svg{display:block}
.official-bar .ob-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.official-bar .ob-tx b{font-size:12.6px;font-weight:800;color:#0c3b31;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.official-bar .ob-tx span{font-size:10.6px;font-weight:600;color:#5f8377}
.official-bar .ob-lock{flex-shrink:0;color:#8bb3a5}

/* ===== papel de parede ===== */
.stage{background:var(--wa-wall) url("images/wa-bg.svg") repeat !important;background-size:360px !important}
.qpage{padding:4px 9px !important}
.qtop{gap:5px !important}

/* ===== balões ===== */
.qrow{gap:0 !important;align-items:flex-end}
.qrow .mav{display:none !important}
.bubble{position:relative;background:var(--wa-in) !important;color:#111b21 !important;
  border:0 !important;border-radius:9px !important;border-top-left-radius:0 !important;
  box-shadow:0 1px .5px rgba(11,20,26,.13) !important;
  padding:6px 9px 7px 10px !important;font-size:14.7px !important;line-height:1.42 !important;
  max-width:80% !important;margin-left:7px}
.bubble.q{background:var(--wa-in) !important;font-weight:600 !important;font-size:15px !important}
.bubble b{color:var(--wa-green) !important}
/* rabinho do balão que entra (topo-esquerda) */
.qrow:not(.out) .bubble::before{content:"";position:absolute;top:0;left:-7px;width:9px;height:13px;
  background:var(--wa-in);clip-path:polygon(100% 0,100% 100%,0 0)}
/* horário dentro do balão */
.bubble .bmeta{float:right;margin:5px -1px -2px 9px;font-size:10px;color:var(--wa-time);
  line-height:1;position:relative;top:3px;white-space:nowrap;font-weight:500}
.bubble .bmeta svg{vertical-align:-2px;margin-left:2px}

/* ===== resposta do usuário: balão verde à direita ===== */
.qrow.out{justify-content:flex-end;margin:2px 0}
.qrow.out .bubble{background:var(--wa-out) !important;color:#111b21 !important;
  border-top-left-radius:9px !important;border-top-right-radius:0 !important;margin:0 7px 0 0;
  animation:popOut .22s ease both}
.qrow.out .bubble::after{content:"";position:absolute;top:0;right:-7px;width:9px;height:13px;
  background:var(--wa-out);clip-path:polygon(0 0,0 100%,100% 0)}
.qrow.out .bubble .bmeta{color:#5f7c6b}
@keyframes popOut{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}

/* ===== respostas rápidas (botões estilo WhatsApp Business) ===== */
.opts{padding-top:12px !important;margin-top:8px !important;gap:8px !important}
.opt{background:#fff !important;border:1px solid #e7ebed !important;border-radius:13px !important;
  padding:12px 13px !important;gap:12px !important;box-shadow:0 1px 2px rgba(11,20,26,.09) !important}
.opt .em{width:38px !important;height:38px !important;min-width:38px !important;border-radius:50% !important;
  background:#e9f6f1 !important;border:1px solid #d7ede5 !important;font-size:19px !important;box-shadow:none !important}
.opt span.lbl{color:#111b21 !important;font-weight:600 !important;font-size:14.7px !important}
.opt .ar{background:#eef7f4 !important;color:var(--wa-teal) !important}
.opt:hover{border-color:var(--wa-teal) !important;background:#fbfffe !important;box-shadow:0 6px 16px -10px rgba(18,140,126,.5) !important}
.opt:hover .ar{background:var(--wa-teal) !important;color:#fff !important}
.opt.sel{border-color:var(--wa-send) !important;background:#f1fff0 !important;box-shadow:0 0 0 2px rgba(0,168,132,.32) !important}
.opt.sel .em,.opt.sel .ar{background:var(--wa-send) !important;color:#fff !important;border-color:var(--wa-send) !important}
/* botão continuar/confirmar identidade — ação primária teal */
.opt#contBtn,.opt#idBtn{justify-content:center !important;background:var(--wa-teal) !important;border-color:var(--wa-teal) !important;box-shadow:0 10px 22px -12px rgba(18,140,126,.7) !important}
.opt#contBtn span.lbl,.opt#idBtn span.lbl{color:#fff !important;flex:0 0 auto}
.opt#contBtn .em,.opt#idBtn .em{background:rgba(255,255,255,.2) !important;border-color:transparent !important}
.opt#contBtn .ar,.opt#idBtn .ar{background:rgba(255,255,255,.2) !important;color:#fff !important}
.opt#contBtn:hover,.opt#idBtn:hover{background:#0f7a6d !important}

/* ===== barra de digitar (rodapé fixo do WhatsApp) ===== */
.wa-foot{display:none;align-items:center;gap:7px;padding:7px 8px;background:var(--wa-foot);
  position:relative;z-index:20;flex-shrink:0}
.wa-foot.active{display:flex}
.wa-foot .wf-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;
  border-radius:24px;padding:9px 12px;box-shadow:0 1px 1px rgba(11,20,26,.06)}
.wa-foot .wf-pill>svg{flex-shrink:0;color:#8696a0}
.wf-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:15px;color:#111b21}
.wf-input::placeholder{color:#8696a0}
.wa-foot .wf-fab{width:46px;height:46px;flex-shrink:0;border:0;border-radius:50%;
  background:var(--wa-send);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 10px -3px rgba(0,168,132,.6);transition:transform .12s ease,background .2s}
.wa-foot .wf-fab:active{transform:scale(.94)}
.wa-foot.active .wf-pill{box-shadow:0 0 0 2px rgba(0,168,132,.25)}

/* ===== sugestão de banco: aparece ACIMA do campo conforme ela digita ===== */
.wa-foot{position:relative}
.ac-list{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);z-index:60;background:#fff;
  border-radius:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.06);
  overflow:hidden;display:none;max-height:216px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ac-list.show{display:block;animation:acIn .16s ease both}
@keyframes acIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ac-item{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14.5px;font-weight:600;
  color:#111b21;cursor:pointer;border-bottom:1px solid #f0f2f5}
.ac-item:last-child{border-bottom:0}
.ac-item:active{background:#f0f2f5}
.ac-item b{color:#00a884}
.ac-ic{width:28px;height:28px;border-radius:8px;background:#e9f7f3;color:#00a884;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}

/* ===== TELA DE ASSINATURA (abre por cima de tudo) ===== */
/* z-index ACIMA da tela do contrato (9200) e do visor do PDF (9400): a
   assinatura é chamada de dentro do contrato e precisa vir por cima dele.
   Com 9000 ela abria ATRÁS e a pessoa não conseguia assinar. */
.sig-tela{position:fixed;inset:0;z-index:9600;background:#0f1b16;display:flex;flex-direction:column;
  animation:sigSobe .26s cubic-bezier(.22,.9,.31,1) both}
@keyframes sigSobe{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sig-topo{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#12241d;color:#fff;flex-shrink:0}
.sig-topo .volta{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.sig-topo b{font-size:15px;font-weight:800;display:block}
.sig-topo small{display:block;font-size:11.5px;color:#9fd3bd;margin-top:1px}
.sig-corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 16px;gap:12px;overflow-y:auto}
.sig-instr{text-align:center;color:#cfe6dc;font-size:13.5px;font-weight:600;line-height:1.5}
.sig-area{position:relative;background:#fff;border-radius:16px;height:min(46vh,320px);overflow:hidden;
  box-shadow:0 20px 44px -20px rgba(0,0,0,.7)}
.sig-area canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sig-linha{position:absolute;left:26px;right:26px;bottom:64px;height:1px;background:#d8cfc6;pointer-events:none}
.sig-linha::after{content:"assine aqui";position:absolute;left:0;top:8px;font-size:11px;color:#b9afa4;letter-spacing:.4px}
.sig-area.tinta .sig-linha::after{opacity:0}
.sig-limpar{position:absolute;top:10px;right:10px;border:1px solid #e6ddd4;background:#fff;color:#6b6054;
  font-size:12px;font-weight:800;padding:7px 13px;border-radius:100px;cursor:pointer}
.sig-nome{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;
  border-radius:13px;padding:14px 15px;font-family:inherit;font-size:15px;font-weight:600;outline:0}
.sig-nome::placeholder{color:#8fae9f}
.sig-nome.ruim{border-color:#ff8f7a;background:rgba(255,143,122,.12)}
.sig-acoes{padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:#12241d;flex-shrink:0}
.sig-ok{width:100%;border:0;border-radius:14px;padding:16px;font-family:inherit;font-size:16px;font-weight:800;
  color:#fff;background:linear-gradient(135deg,#25a36c,#12784c);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:9px;box-shadow:0 14px 28px -12px rgba(18,120,76,.8)}
.sig-ok:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.sig-aviso{text-align:center;font-size:11px;color:#8fae9f;margin-top:10px;line-height:1.5}

/* ===== VÍDEO DE ABERTURA (antes de confirmar os dados) ===== */
.vintro{margin:8px 0 0 7px;max-width:86%;background:#000;border-radius:18px;overflow:hidden;position:relative;
  box-shadow:0 14px 34px -16px rgba(12,30,19,.6);animation:pop .4s ease both}
.vintro video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000;max-height:64vh}
.vintro .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.42));cursor:pointer;z-index:2;transition:opacity .25s ease}
.vintro.playing .vplay{opacity:0;pointer-events:none}
.vintro .vplay .pb{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;
  justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.vintro .vplay .pb svg{width:28px;height:28px;color:var(--g700);margin-left:3px}
.vintro .vplay .vlbl{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:800;
  text-shadow:0 2px 8px rgba(0,0,0,.7);letter-spacing:.2px}
.vintro .vbadge{position:absolute;top:11px;left:11px;z-index:3;background:rgba(255,255,255,.92);border-radius:8px;
  padding:3px 9px;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.vintro .vbadge img{height:13px;width:auto;display:block}
.vintro .vbadge b{font-size:9px;font-weight:800;color:#c96e0c;letter-spacing:.4px}
/* barrinha de progresso do vídeo */
.vintro .vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.22);z-index:3}
.vintro .vprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g400),var(--gvivid))}
/* botão continuar do gate — nasce travado até assistir */
.vlock{display:flex;align-items:center;justify-content:center;gap:9px;margin:12px 0 0 7px;max-width:86%;
  border:0;border-radius:14px;padding:15px;font-family:inherit;font-size:15.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#25a36c,#12784c);box-shadow:0 12px 26px -12px rgba(18,120,76,.8);cursor:pointer}
.vlock svg{width:18px;height:18px}
.vlock:disabled{background:#e7e1db;color:#9a8f84;box-shadow:none;cursor:not-allowed}
.vlock .vtime{font-variant-numeric:tabular-nums}

/* ===== CONTRATO completo ===== */
/* Cartão no chat que abre o documento (a Fernanda "manda" o contrato) */
.ctr-conv{background:#fff;border:1px solid #e6ddd4;border-radius:16px;margin:8px 0 0 7px;max-width:95%;
  padding:14px 15px;box-shadow:0 8px 22px -14px rgba(12,30,19,.35)}
.ctr-conv .cc-top{display:flex;align-items:center;gap:11px}
.ctr-conv .cc-ico{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:#fdeedd;color:#8a4f10;
  display:flex;align-items:center;justify-content:center}
.ctr-conv .cc-nome{font-size:13.5px;font-weight:800;color:#122418;line-height:1.3}
.ctr-conv .cc-sub{font-size:11.5px;color:#8a8075;margin-top:2px}
.ctr-conv .cc-abrir{margin-top:12px;width:100%;border:0;border-radius:13px;padding:14px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:800;color:#082312;
  background:linear-gradient(135deg,#ffa545,#f2881c);box-shadow:0 12px 26px -12px rgba(217,110,8,.8);
  display:flex;align-items:center;justify-content:center;gap:8px}
.ctr-conv .cc-abrir:active{transform:scale(.985)}
.ctr-conv .cc-pe{margin-top:9px;font-size:10.5px;color:#9a8f84;text-align:center;line-height:1.5}

/* ===== TELA CHEIA DO CONTRATO ===== */
.ct-tela{position:fixed;inset:0;z-index:9200;background:#f1ede9;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:ctSobe .3s cubic-bezier(.22,.9,.31,1) both}
@keyframes ctSobe{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ct-in{max-width:460px;margin:0 auto;padding-bottom:34px}

/* topo grafite */
.ct-hero{background:#0a5726;color:#fff;padding:20px 20px 26px;position:relative;overflow:hidden}
.ct-hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,136,28,.22),transparent 68%)}
.ct-volta{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:14px}
.ct-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:#f2881c;display:flex;align-items:center;gap:8px}
.ct-eyebrow::before{content:"";width:16px;height:2px;background:#f2881c;border-radius:2px}
.ct-hero h1{font-size:29px;line-height:1.12;font-weight:800;margin:10px 0 0;letter-spacing:-.6px;position:relative}
.ct-hero h1 em{font-style:normal;color:#f2881c}
.ct-hero p{font-size:13.5px;line-height:1.55;color:#c9beb3;margin:11px 0 0;position:relative}

/* faixa de chips */
.ct-chips{display:flex;background:#fbf3ea;border-bottom:1px solid #ecdece}
.ct-chips div{flex:1;padding:12px 6px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  color:#8a4f10;line-height:1.35}
.ct-chips div+div{border-left:1px solid #ecdece}

/* folha do documento */
.ct-serra{height:11px;background:repeating-linear-gradient(-45deg,#f2881c 0 9px,transparent 9px 19px);margin:18px 14px -1px}
.ct-folha{background:#fff;margin:0 14px;border-radius:0 0 14px 14px;padding:20px 18px 22px;
  box-shadow:0 20px 44px -26px rgba(12,30,19,.5)}

.ct-marca{font-size:9.5px;font-weight:800;letter-spacing:2.6px;color:#a09284;text-transform:uppercase}
.ct-titulo{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:7px}
.ct-titulo h2{font-size:19px;line-height:1.24;font-weight:800;color:#0a5726;letter-spacing:-.35px;margin:0}
.ct-titulo .ic{width:34px;height:34px;flex-shrink:0;border-radius:9px;background:#fdeedd;color:#c96e0c;
  display:flex;align-items:center;justify-content:center}
.ct-meta{display:flex;justify-content:space-between;gap:12px;margin-top:15px;padding:11px 0;
  border-top:1px solid #efe8e0;border-bottom:1px solid #efe8e0;font-size:11px;color:#8a8075}
.ct-meta b{color:#3b332a;font-weight:800}

/* seções */
.ct-sec{margin-top:22px}
.ct-h{font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8a4f10;
  padding-bottom:7px;border-bottom:2px solid #f2881c;display:inline-block;margin-bottom:4px}
.ct-l{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px solid #f4eee7}
.ct-l:last-child{border-bottom:0}
.ct-l span{font-size:12.5px;color:#8a8075;flex-shrink:0}
.ct-l b{font-size:12.5px;font-weight:800;color:#0a5726;text-align:right;word-break:break-word}
.ct-l.forte b{color:#0f6b3f}

/* cronograma */
.ct-tab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.ct-tab th{background:#f7f2ec;color:#8a8075;font-size:9px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  padding:9px 10px;text-align:left}
.ct-tab th:last-child,.ct-tab td:last-child{text-align:right}
.ct-tab td{padding:9px 10px;color:#3b332a;border-bottom:1px solid #f4eee7}
.ct-tab tbody tr:nth-child(even) td{background:#fcf9f5}
.ct-tab td:first-child{font-weight:800;color:#0a5726}
.ct-tab td:last-child{font-weight:800;color:#0a5726}
.ct-tab tfoot td{background:#fdf3e8;font-weight:800;color:#8a4f10;border-bottom:0;border-top:1px solid #f0dfcc}
.ct-mais{width:100%;margin-top:9px;border:1px solid #ecdece;background:#fdf9f5;color:#8a4f10;border-radius:11px;
  padding:11px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.ct-mais:active{transform:scale(.99)}

/* cláusulas */
/* alinhado à esquerda de propósito: justificado numa coluna estreita de celular
   abre rios de espaço no meio da frase e o contrato fica pior de ler */
.ct-cl{font-size:12.5px;line-height:1.65;color:#5b5248;margin-top:13px}
.ct-cl:first-of-type{margin-top:10px}
.ct-cl b{color:#0a5726;font-weight:800}

/* assinatura */
.ct-assarea{margin-top:8px}
.ct-declara{font-size:11.5px;line-height:1.6;color:#8a8075;margin:10px 0 14px}
.ct-quadro{border:1.5px dashed #ded1c4;border-radius:12px;height:150px;display:flex;align-items:center;
  justify-content:center;background:#fdfbf9;position:relative;overflow:hidden}
.ct-quadro .dica{font-size:12px;color:#b3a79a;font-weight:600}
.ct-quadro.tem{border-style:solid;border-color:#e8dccf;background:#fdf6ef}
.ct-quadro img{max-width:88%;max-height:126px;object-fit:contain}
.ct-qnome{text-align:center;margin-top:11px}
.ct-qnome .n{font-size:13px;font-weight:800;color:#0a5726;letter-spacing:.2px}
.ct-qnome .c{font-size:9.5px;font-weight:800;letter-spacing:2px;color:#a09284;margin-top:3px}

/* botões */
.ct-acoes{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.ct-linha2{display:flex;gap:10px}
.ct-btn{flex:1;border:0;border-radius:13px;padding:15px;font-family:inherit;font-size:14.5px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px;
  color:#082312;background:linear-gradient(135deg,#ffa545,#f2881c);box-shadow:0 13px 26px -13px rgba(217,110,8,.85)}
.ct-btn:active{transform:scale(.985)}
.ct-btn:disabled{background:#e3ebe4;color:#b3a79a;box-shadow:none;cursor:not-allowed}
.ct-btn.escuro{background:#0a5726;color:#fff;box-shadow:0 13px 26px -14px rgba(19,138,58,.9)}
.ct-btn.escuro:disabled{background:#e3ebe4;color:#b3a79a;box-shadow:none}
.ct-btn.vazio{background:#fff;color:#3b332a;border:1px solid #e2d8cd;box-shadow:none}
.ct-btn.mini{flex:0 0 54px;padding:15px 0}
.ct-aviso{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#b3a79a;text-transform:uppercase}
.ct-seg{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:11px;line-height:1.55;color:#8a8075}
.ct-seg svg{flex-shrink:0;margin-top:1px;color:#0f6b3f}

/* rodapé legal */
.ct-rodape{margin:20px 20px 0;font-size:10.5px;line-height:1.65;color:#8a8075}
.ct-rodape b{color:#5b5248}

/* tela "contrato gerado" */
.ct-ok{text-align:center;padding:8px 4px 4px}
.ct-ok .selo{width:60px;height:60px;margin:0 auto;border-radius:50%;border:2.5px solid #0f6b3f;color:#0f6b3f;

.ct-ok h2{font-size:24px;font-weight:800;color:#0a5726;margin:14px 0 0;letter-spacing:-.4px}
.ct-ok p{font-size:13px;line-height:1.6;color:#8a8075;margin:9px 0 0}
.ct-ok p b{color:#3b332a}
.ct-resumo{border:1.5px solid #f2881c;border-radius:13px;padding:14px 15px;margin-top:18px;background:#fffbf7;text-align:left}
.ct-resumo .rh{font-size:9.5px;font-weight:800;letter-spacing:2px;color:#8a4f10;text-align:center;margin-bottom:9px}
.ct-resumo .ct-l{border-bottom:1px dashed #f0dfcc}

/* spinner do botão gerar */
.ct-spin{width:15px;height:15px;border-radius:50%;border:2.2px solid rgba(8,35,18,.25);
  border-top-color:#082312;animation:ctGira .7s linear infinite;display:inline-block}
@keyframes ctGira{to{transform:rotate(360deg)}}

/* visualizador do PDF */
.ct-visor{position:fixed;inset:0;z-index:9400;background:#183322;display:flex;flex-direction:column}
.ct-vtopo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  background:#0a5726;color:#fff;flex-shrink:0}
.ct-vtopo span{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:#c9beb3}
.ct-vvolta{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:#f2881c;
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;padding:4px 2px}
.ct-visor iframe{flex:1;width:100%;border:0;background:#fff}

/* ===== TRÊS PROPOSTAS (substitui o slider de valor) ===== */
.props{margin:8px 0 0 7px;max-width:95%;display:flex;flex-direction:column;gap:10px}
.props-h{font-size:12px;font-weight:800;color:#5b5045;letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
.prop-card{position:relative;background:#fff;border:2px solid #e8dfd6;border-radius:16px;padding:14px 14px 12px;cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .12s}
.prop-card:active{transform:scale(.99)}
.prop-card.on{border-color:#c0721e;box-shadow:0 0 0 3px rgba(192,114,30,.16),0 14px 30px -18px rgba(80,51,20,.6)}
.prop-card .prop-tag{position:absolute;top:-9px;left:14px;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:#3f352a;background:linear-gradient(135deg,#ffaf5a,#e08019);padding:3px 9px;border-radius:100px;box-shadow:0 3px 8px -2px rgba(160,92,20,.5)}
.prop-card .prop-nome{font-size:11.5px;font-weight:800;color:#8a7b6b;letter-spacing:.4px;text-transform:uppercase}
.prop-card .prop-val{font-family:inherit;font-size:26px;font-weight:800;color:#152d1e;letter-spacing:-.8px;line-height:1.1;margin-top:3px}
.prop-card .prop-parc{font-size:13px;font-weight:700;color:#4a7c59;margin-top:2px}
.prop-card .prop-parc b{color:#2f6b45}
.prop-card .prop-grid{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #eee3d8}
.prop-card .prop-g{flex:1;min-width:0}
.prop-card .prop-g small{display:block;font-size:9.5px;font-weight:700;color:#9a8c7e;text-transform:uppercase;letter-spacing:.3px}
.prop-card .prop-g b{display:block;font-size:12.5px;font-weight:800;color:#3a3128;margin-top:1px}
.prop-card .prop-pix{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:700;color:#2f6b45}
.prop-card .prop-check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:2px solid #ded2c6;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.18s}
.prop-card.on .prop-check{background:#c0721e;border-color:#c0721e}
.prop-card .prop-check svg{opacity:0;transition:.18s}
.prop-card.on .prop-check svg{opacity:1}
/* resumo do que ela escolheu + confirmar */
.prop-sel{margin-top:4px;background:#fff8f0;border:1px solid #f0dbc4;border-radius:14px;padding:12px 14px}
/* estado confirmado do botão */
#pBtn.confirmado{background:#2f6b45 !important;box-shadow:none !important;opacity:1 !important;cursor:default}
.prop-sel small{display:block;font-size:10px;font-weight:800;color:#9a8c7e;text-transform:uppercase;letter-spacing:.6px}
.prop-sel b{display:block;font-size:21px;font-weight:800;color:#152d1e;letter-spacing:-.6px;margin-top:2px}
.prop-sel span{display:block;font-size:12px;color:#6b6054;font-weight:600;margin-top:1px}

/* cartões de oferta: mantêm o dourado, mas com respiro de "mensagem" */
.vcard,.idcard,.summary,.signcard,.contract,.addrcard,.offer{margin-left:7px !important;max-width:95% !important}
@media (prefers-reduced-motion:reduce){.qrow.out .bubble{animation:none}}

<script>
/* ============ ESTADO ============ */
var answers = {};
try { answers = JSON.parse(localStorage.getItem('cf_answers') || '{}'); } catch(e){}
function saveAns(k,v){ answers[k]=v; try{ localStorage.setItem('cf_answers', JSON.stringify(answers)); }catch(e){} }
var nome=''; try{ nome=(localStorage.getItem('nome')||'').trim().split(' ')[0]; }catch(e){}
var oi = nome ? (nome.charAt(0).toUpperCase()+nome.slice(1)) : '';
function brl(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); }

/* ===== Efeitos sonoros do chat — som de mensagem (estilo Typebot) =====
   Toca um MP3 curto e agradável (o mesmo "ding" de app de mensagem).
   Só toca depois do 1º toque do usuário (política de autoplay dos browsers). */
var SFX = (function(){
  var URL='sounds/recv.mp3';
  var unlocked=false, muted=false, last=0;
  try{ muted = localStorage.getItem('sfx_off')==='1'; }catch(e){}
  function make(vol){ var a=new Audio(URL); a.volume=vol; a.preload='auto'; return a; }
  function unlock(){
    if(unlocked) return; unlocked=true;
    try{ var p=make(0); var pr=p.play(); if(pr&&pr.then){ pr.then(function(){ p.pause(); p.currentTime=0; }).catch(function(){}); } }catch(e){}
  }
  function play(vol){
    if(muted || !unlocked) return;
    var n=Date.now(); if(n-last<70) return; last=n;   // evita empilhar sons
    try{ make(vol).play().catch(function(){}); }catch(e){}
  }
  return {
    unlock: unlock,
    sent: function(){ play(0.5); },    // mensagem enviada (mais discreto)
    recv: function(){ play(0.85); },   // mensagem recebida (o "ding" cheio)
    setMuted: function(m){ muted=!!m; try{ localStorage.setItem('sfx_off', m?'1':'0'); }catch(e){} }
  };
})();
['pointerdown','touchstart','keydown','click'].forEach(function(ev){
  document.addEventListener(ev, function(){ SFX.unlock(); }, {once:true, passive:true});
});

/* ===== Gênero pelo primeiro nome — a Fernanda flexiona sozinha (nada de "honesto(a)") ===== */
var _FEM=null;
function ehFeminino(){
  if(_FEM!==null) return _FEM;
  var n=(localStorage.getItem('nome')||localStorage.getItem('name')||'').trim().toLowerCase().split(/\s+/)[0].replace(/[^a-zà-ú]/g,'');
  var fem=['beatriz','ester','esther','raquel','rachel','isabel','isabela','mabel','karen','caren','carem','miriam','miria','ruth','rute','ingrid','astrid','nicole','michele','michelle','gisele','simone','ivone','yasmin','iasmin','carmen','dolores','lourdes','pilar','flor','liz','mel','agnes','ines','ines','clarice','jaqueline','jacqueline','kelly','kely','shirley','sheila','janaina','madalena','heloa','maisa','thais','tais','lais','pietra','cleide','solange','marlene','darlene','irene','helen','ellen','isadora'];
  var masc=['luca','juca','noa','nicola','josua','joshua','ravi','ubiratan','ubirajara','sabino'];
  var f;
  if(fem.indexOf(n)>=0) f=true;
  else if(masc.indexOf(n)>=0) f=false;
  else f=/a$/.test(n);
  _FEM=f; return f;
}
/* resolve "honesto(a)", "você mesmo(a)", "PRÉ-APROVADO(A)", "(a)" -> forma certa do gênero */
function gener(s){
  s=String(s);
  if(ehFeminino()){
    return s.replace(/o\(a\)/g,'a').replace(/O\(A\)/g,'A').replace(/\(a\)/g,'a').replace(/\(A\)/g,'A');
  }
  return s.replace(/o\(a\)/g,'o').replace(/O\(A\)/g,'O').replace(/\(a\)/g,'').replace(/\(A\)/g,'');
}

/* ============ ÁUDIOS (mensagens de voz da Fernanda) ============
   Para ativar um áudio numa pergunta, adicione  audio:'audio/audio-1.mp3'  no objeto da pergunta.
   Os arquivos já estão em /audio (audio-1.mp3, audio-2.mp3, audio-3.mp3).
   Deixei DESLIGADO por padrão até confirmar qual áudio é a voz certa.            */
var VOICE_ENABLED = false;
var VOICE_INTRO = 'audio/audio-1.mp3';

/* puxa o que a página 3 mandou pela URL */
(function(){
  var url=new URLSearchParams(location.search);
  function mapFin(v){ v=(v||'').toLowerCase();
    if(v.indexOf('dívid')>=0||v.indexOf('divid')>=0)return'dividas';
    if(v.indexOf('saúd')>=0||v.indexOf('saud')>=0||v.indexOf('médic')>=0||v.indexOf('medic')>=0)return'medica';
    if(v.indexOf('reform')>=0)return'reforma';
    if(v.indexOf('investi')>=0||v.indexOf('negóc')>=0||v.indexOf('negoc')>=0)return'negocio';
    return 'outro'; }
  function mapRenda(v){ v=v||'';
    if(v.indexOf('1.500 a')>=0)return 2300; if(v.indexOf('3.000 a')>=0)return 4000;
    if(v.indexOf('5.000 a')>=0)return 7500; if(v.indexOf('Acima')>=0||v.indexOf('10.000')>=0)return 12000;
    if(v.indexOf('Até')>=0||v.indexOf('1.500')>=0)return 1300; return 0; }
  /* dados das 5 perguntas da página 3 chegam pela URL e têm PRIORIDADE.
     Se a finalidade mudou em relação à anterior, zera as respostas antigas (evita recap misturada).
     Persiste tudo no localStorage pra sincronizar mesmo abrindo o chat direto/refresh. */
  function mapOcc(v){ v=(v||'').toLowerCase();
    if(v.indexOf('desempreg')>=0)return'desempregado';
    if(v.indexOf('clt')>=0||v.indexOf('empregad')>=0)return'clt';
    if(v.indexOf('públic')>=0||v.indexOf('public')>=0||v.indexOf('funcion')>=0)return'publico';
    if(v.indexOf('autôn')>=0||v.indexOf('auton')>=0)return'autonomo';
    if(v.indexOf('empres')>=0||v.indexOf('mei')>=0)return'empresario';
    if(v.indexOf('aposent')>=0||v.indexOf('pension')>=0)return'aposentado';
    if(v.indexOf('dona')>=0||v.indexOf(' lar')>=0)return'donadecasa';
    if(v.indexOf('estudante')>=0)return'estudante';
    if(v.indexOf('rentista')>=0)return'rentista';
    return'outro'; }
  if(url.get('loanPurpose')){
    var f=mapFin(url.get('loanPurpose'));
    if(answers.finalidade && answers.finalidade!==f) answers={};
    saveAns('finalidade', f);
  }
  if(url.get('cpfSituation')) saveAns('negativado', /negativ/i.test(url.get('cpfSituation'))?'sim':'nao');
  if(url.get('monthlyIncome')){ var r=mapRenda(url.get('monthlyIncome')); if(r) saveAns('renda', r); }
  if(url.get('occupation')) saveAns('ocupacao_key', mapOcc(url.get('occupation')));
  if(url.get('education')) saveAns('escolaridade', url.get('education'));
  /* patrimônio — pergunta nova da etapa 6 da página 3 */
  function mapBens(v){ v=(v||'').toLowerCase();
    if(v.indexOf('casa e')>=0||v.indexOf('ambos')>=0)return'ambos';
    if(v.indexOf('casa')>=0||v.indexOf('im')>=0)return'proprio';
    if(v.indexOf('ve')>=0||v.indexOf('carro')>=0||v.indexOf('moto')>=0)return'veiculo';
    return'nenhum'; }
  if(url.get('assets')) saveAns('bens', mapBens(url.get('assets')));
})();

/* ============ INFRA DE PÁGINAS ============ */
var AV='images/atendente-credfacil.png';
var stage=document.getElementById('stage'), prog=document.getElementById('prog');
var stEl=document.getElementById('st'), stTxt=document.getElementById('stTxt');
var step=0, totalSteps=16, gen=0;

/* ===== WhatsApp: relógio, horário dos balões e rodapé de digitar ===== */
var waFoot=document.querySelector('.wa-foot');
var wfInput=waFoot?waFoot.querySelector('.wf-input'):null;
var wfFab=waFoot?waFoot.querySelector('.wf-fab'):null;
var MIC_SVG='<svg width="23" height="23" viewBox="0 0 24 24" fill="#fff"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 12a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12z"/></svg>';
var SEND_SVG='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M2.5 21 22 12 2.5 3l.01 7L16 12 2.51 14z"/></svg>';
var TICK2='<svg width="16" height="11" viewBox="0 0 18 12" fill="none" style="vertical-align:-1px"><path d="M1 6.6 4.4 10 10 2.5" stroke="#53bdeb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 6.6 10 10 16.6 2.5" stroke="#53bdeb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* ===== sugestão de banco enquanto digita ===== */
var BANCOS=['Nubank','Caixa Econômica Federal','Banco do Brasil','Bradesco','Itaú Unibanco','Santander',
  'Banco Inter','C6 Bank','PicPay','Mercado Pago','PagBank','Neon','Next','Banco Original','Banco Pan',
  'BMG','Banco Safra','Sicoob','Sicredi','Banrisul','Banestes','BRB','Banco da Amazônia','Banco do Nordeste',
  'Agibank','Banco Daycoval','Sofisa','BS2','Will Bank','Digio','Banco Bari','Banco Modal','BTG Pactual',
  'XP Investimentos','Nubank PJ','Caixa Tem','Banco Votorantim','Banco Cetelem','Banco Master','Stone','InfinitePay'];

var acList=document.getElementById('acList');
function acFechar(){ if(acList){ acList.classList.remove('show'); acList.innerHTML=''; } }
function acAbrir(termo, escolher){
  if(!acList) return;
  var t=(termo||'').trim().toLowerCase();
  if(t.length<1){ acFechar(); return; }
  var achados=BANCOS.filter(function(b){ return b.toLowerCase().indexOf(t)>=0; });
  /* quem COMEÇA com o que ela digitou vem primeiro */
  achados.sort(function(a,b){ return a.toLowerCase().indexOf(t) - b.toLowerCase().indexOf(t); });
  achados=achados.slice(0,6);
  if(!achados.length){ acFechar(); return; }
  acList.innerHTML=achados.map(function(b){
    var i=b.toLowerCase().indexOf(t);
    var marcado=b.slice(0,i)+'<b>'+b.slice(i,i+t.length)+'</b>'+b.slice(i+t.length);
    return '<div class="ac-item" data-b="'+b.replace(/"/g,'&quot;')+'">'
         + '<span class="ac-ic">'+b.charAt(0).toUpperCase()+'</span><span>'+marcado+'</span></div>';
  }).join('');
  acList.classList.add('show');
  [].forEach.call(acList.querySelectorAll('.ac-item'), function(el){
    el.onclick=function(){ escolher(el.getAttribute('data-b')); };

}

function nowHM(){ var d=new Date(); return d.getHours()+':'+('0'+d.getMinutes()).slice(-2); }
(function(){ var t=document.getElementById('psTime'); if(!t)return; function tk(){ t.textContent=nowHM(); } tk(); setInterval(tk,20000); })();
function footIdle(){ if(!wfInput)return; wfInput.value=''; wfInput.readOnly=true; wfInput.placeholder='Mensagem'; wfInput.removeAttribute('inputmode'); if(waFoot)waFoot.classList.remove('active'); if(wfFab){ wfFab.innerHTML=MIC_SVG; wfFab.onclick=null; wfFab.setAttribute('aria-label','gravar áudio'); } wfInput.onkeydown=null; wfInput.oninput=null; acFechar(); }
function footActive(cfg, submit){ if(!wfInput)return; wfInput.readOnly=false; wfInput.value=''; wfInput.placeholder=cfg.placeholder||'Digite aqui...'; if(cfg.inputmode)wfInput.setAttribute('inputmode',cfg.inputmode); else wfInput.removeAttribute('inputmode'); if(waFoot)waFoot.classList.add('active'); if(wfFab){ wfFab.innerHTML=SEND_SVG; wfFab.setAttribute('aria-label','enviar'); wfFab.onclick=submit; } wfInput.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); acFechar(); submit(); } };
  /* campo de banco: sugere os nomes conforme ela digita, e um toque já preenche e envia */
  acFechar();
  if(cfg.autocomplete==='bancos'){
    wfInput.oninput=function(){ acAbrir(wfInput.value, function(nomeBanco){ wfInput.value=nomeBanco; acFechar(); submit(); }); };
  } else { wfInput.oninput=null; } setTimeout(function(){ try{ wfInput.focus(); }catch(_){} },40); }
/* balão verde: resposta do usuário no chat */
function echoOut(page, text){ var host=(page&&page.querySelector)?page.querySelector('.qtop'):null; if(!host)return; var row=document.createElement('div'); row.className='qrow out'; row.innerHTML='<div class="bubble">'+String(text).replace(/</g,'&lt;').replace(/>/g,'&gt;')+'<span class="bmeta">'+nowHM()+' '+TICK2+'</span></div>'; host.appendChild(row); scrollPage(host); SFX.sent(); }
function md(s){ return gener(String(s)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
/* tempo de leitura proporcional ao texto (pra falas que avançam sozinhas) */
function readMs(t){ t=(Array.isArray(t)?t.join(' '):String(t)); return Math.min(5200, 1300 + t.length*34); }
function setProg(){ step++; prog.style.width=Math.min(100,(step/totalSteps)*100)+'%'; }
/* topo fica SEMPRE "online" — o "digitando" aparece só nos pontinhos do balão, não no header */
function setTyping(on){ /* no-op de propósito: não altera o status do topo */ }
/* Rola a THREAD inteira até o fim — mas respeita quem subiu pra reler.
   Se ela está lendo uma mensagem lá em cima, mensagem nova não puxa de volta. */
var COLADA_NO_FIM=true, MARGEM_FIM=130;
function noFimDaThread(){ return (stage.scrollHeight - stage.clientHeight - stage.scrollTop) <= MARGEM_FIM; }
if(stage) stage.addEventListener('scroll',function(){ COLADA_NO_FIM=noFimDaThread(); },{passive:true});

function scrollPage(el, forcar){
  if(!stage) return;
  if(!forcar && !COLADA_NO_FIM) return;
  var ir=function(){ stage.scrollTop=stage.scrollHeight; };
  ir(); requestAnimationFrame(ir); setTimeout(ir,90); setTimeout(ir,320);
}

/* troca a página atual por outra (transição "próxima tela").
   incrementa gen pra invalidar timers de digitação da página anterior (anti-bug do "digitando") */
/* Antes esta função APAGAVA a etapa anterior do DOM — era isso que fazia a
   conversa sumir e recomeçar, sem a pessoa poder voltar pra reler.
   Agora a etapa anterior vira histórico: continua na tela, acima, só perde
   a interação pra ela não responder duas vezes no mesmo lugar. */
function swapPage(node){
  gen++;
  footIdle();
  var anteriores=stage.querySelectorAll('.qpage:not(.past)');
  for(var i=0;i<anteriores.length;i++){
    var ant=anteriores[i];
    /* telas de espera ("Analisando...", "Gerando contrato...") NÃO são conversa:
       elas somem quando a próxima chega. Se ficassem no histórico, o spinner
       continuaria girando pra sempre no meio do papo. */
    if(ant.querySelector('.analyzing')){ if(ant.parentNode) ant.parentNode.removeChild(ant); continue; }
    ant.classList.remove('enter'); ant.classList.add('past');
  }
  node.classList.add('qpage','enter');
  stage.appendChild(node);
  /* etapa nova sempre traz a pessoa junto, mesmo se ela tinha subido */
  scrollPage(node, true);
}

/* mensagem de voz estilo WhatsApp */
function voiceRow(src){
  var bars=''; for(var i=0;i<26;i++){ bars+='<i style="height:'+(22+Math.round(Math.abs(Math.sin(i*1.3))*70))+'%"></i>'; }
  var id='v'+Math.random().toString(36).slice(2,8);
  var row=document.createElement('div'); row.className='qrow';
  row.innerHTML='<div class="mav"><img src="'+AV+'" alt=""></div>'
    +'<div class="bubble"><div class="voice"><button class="play" id="'+id+'b"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'
    +'<div class="wave" id="'+id+'w">'+bars+'</div><div class="meta"><span class="t" id="'+id+'t">0:00</span></div></div></div>';
  setTimeout(function(){
    var a=new Audio(src); var btn=document.getElementById(id+'b'); var wave=document.getElementById(id+'w'); var t=document.getElementById(id+'t');
    var pi=document.querySelector('#'+id+'b svg');
    function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
    a.addEventListener('loadedmetadata',function(){ t.textContent=fmt(a.duration); });
    a.addEventListener('timeupdate',function(){ var p=a.currentTime/(a.duration||1); var bs=wave.querySelectorAll('i'); var on=Math.round(p*bs.length); bs.forEach(function(b,i){ b.classList.toggle('on',i<on); }); t.textContent=fmt(a.duration-a.currentTime); });
    a.addEventListener('ended',function(){ btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; wave.querySelectorAll('i').forEach(function(b){b.classList.remove('on');}); t.textContent=fmt(a.duration); });
    btn.onclick=function(){ if(a.paused){ a.play(); btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'; } else { a.pause(); btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; } };
  },30);
  return row;
}

/* monta os balões da Fernanda com DIGITAÇÃO em tempo real, depois chama done() */
function typeMessages(page, msgs, opts, done){
  if(typeof opts==='function'){ done=opts; opts=null; }
  var host=page.querySelector('.qtop'); var i=0; var myGen=gen;
  function alive(){ return myGen===gen; }
  (function next(){
    if(!alive()) return;
    if(i>=msgs.length){ setTyping(false); maybeVoice(); return; }
    setTyping(true);
    var ghost=i>0;
    var row=document.createElement('div'); row.className='qrow';
    row.innerHTML='<div class="mav'+(ghost?' ghost':'')+'"><img src="'+AV+'" alt=""></div><div class="bubble typing-b"><span class="typing"><span></span><span></span><span></span></span></div>';
    host.appendChild(row); scrollPage(host);
    /* tempo com os "..." de digitando antes do balão aparecer.
       Proporcional ao tamanho do texto, como alguém digitando de verdade. */
    var txt=msgs[i], delay=Math.min(1700,620+txt.length*15);
    setTimeout(function(){
      if(!alive()){ if(row.parentNode) row.parentNode.removeChild(row); return; }
      var bub=row.querySelector('.bubble');
      bub.classList.remove('typing-b');
      if(i===msgs.length-1) bub.classList.add('q');
      bub.innerHTML=md(txt)+'<span class="bmeta">'+nowHM()+'</span>';
      scrollPage(host); i++; SFX.recv();
      if(i>=msgs.length){ setTyping(false); maybeVoice(); }
      /* respiro entre uma mensagem e a próxima, pra dar tempo de ler */
      else setTimeout(next, Math.min(2300, 720 + txt.length*18));
    },delay);
  })();
  function maybeVoice(){
    if(!alive()) return;
    if(VOICE_ENABLED && opts && opts.audio){
      setTyping(true);
      setTimeout(function(){ if(!alive())return; setTyping(false); host.appendChild(voiceRow(opts.audio)); scrollPage(host); SFX.recv(); setTimeout(function(){ if(alive())done&&done(); },300); }, 900);
    } else { done&&done(); }
  }
}

/* monta página + revela opções só depois da digitação */
function buildOptsHtml(options){
  return options.map(function(o,idx){
    return '<button class="opt" data-i="'+idx+'">'
      + (o.em?'<span class="em">'+o.em+'</span>':'')
      + '<span class="lbl">'+gener(o.label)+'</span>'
      + '<span class="ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    + '</button>';
  }).join('');
}

/* ============ MOTOR DE PERGUNTAS (uma pergunta por página) ============ */
function askQuestion(q,done){
  var msgs = typeof q.agent==='function'?q.agent():q.agent;
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div><div class="opts">'+buildOptsHtml(q.options)+'</div>';
  swapPage(page);
  var optsBox=page.querySelector('.opts');
  page.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      var o=q.options[+b.dataset.i];
      page.querySelectorAll('.opt').forEach(function(x){ x.disabled=true; });
      b.classList.add('sel');
      echoOut(page, gener(o.label));
      var ob=page.querySelector('.opts'); if(ob){ setTimeout(function(){ ob.style.transition='opacity .2s'; ob.style.opacity='0'; ob.style.pointerEvents='none'; },240); }
      if(q.save) saveAns(q.save,o.val);
      setProg();
      var go=function(){ done&&done(o.val); };
      if(o.reply){ setTimeout(function(){ showReply(typeof o.reply==='function'?o.reply():o.reply, go); },540); }
      else setTimeout(go,500);
    };
  });
  typeMessages(page, msgs, {audio:q.audio}, function(){ optsBox.classList.add('show'); scrollPage(page.querySelector('.qtop')); });
}
function askSequence(arr,done){ var i=0; (function nx(){ if(i>=arr.length){done&&done();return;} askQuestion(arr[i],function(){i++;nx();}); })(); }

/* resposta empática curta da Fernanda, depois avança sozinha */
function showReply(text,cb){
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div>';
  swapPage(page);
  typeMessages(page,[text],function(){ setTimeout(cb, readMs(text)); });
}

/* página intermediária (intro/recap) + botão continuar */
function infoPage(msgs,btnLabel,cb,audio){
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div>'
    +'<div class="opts"><button class="opt" id="contBtn"><span class="lbl">'+(btnLabel||'Continuar')+'</span><span class="ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></div>';

/* ====== DEPOIMENTO EM VÍDEO (meio do funil) ======
   Mesmo ritmo de WhatsApp do vídeo de abertura: a Fernanda fala, dá um respiro pra
   ler, volta a "digitar" e SÓ ENTÃO o vídeo chega. O botão de continuar nasce
   TRAVADO e só libera quando o vídeo termina (ou passa de 85%) — senão a pessoa
   pula o depoimento no reflexo e ele não serve pra nada.
   O card reusa o CSS .vintro/.vlock, que já é 9/16 — os depoimentos são verticais. */
var DEPO = { src:'videos/depoimentos/dep9-1.mp4', poster:'videos/depoimentos/dep9-1.jpg', nome:'Gabriela' };
function videoDepoimento(done){
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div>';
  swapPage(page);
  var host=page.querySelector('.qtop');
  var myGen=gen;
  function alive(){ return myGen===gen; }

  var fala='Olha só: a **'+DEPO.nome+'** recebeu o dinheiro dela **ontem** 💸 Ela me deixou te mandar esse vídeo — assiste que é rapidinho 👇';

  typeMessages(page, [fala], function(){
    if(!alive()) return;
    setTimeout(function(){
      if(!alive()) return;
      var tp=document.createElement('div'); tp.className='qrow';
      tp.innerHTML='<div class="mav ghost"><img src="'+AV+'" alt=""></div>'
        +'<div class="bubble typing-b"><span class="typing"><span></span><span></span><span></span></span></div>';
      host.appendChild(tp); scrollPage(host);
      setTimeout(function(){
        if(!alive()) return;
        if(tp.parentNode) tp.parentNode.removeChild(tp);
        montarDepo();
        SFX.recv();
      }, 1900);
    }, 1500);
  });

  function montarDepo(){
    var card=document.createElement('div'); card.className='vintro';
    card.innerHTML=''
      +'<div class="vbadge"><img src="images/credfacil-logo.png" alt="CredFácil"><b>CLIENTE</b></div>'
      +'<video id="vdepoV" src="'+DEPO.src+'" poster="'+DEPO.poster+'" playsinline preload="metadata"></video>'
      +'<div class="vplay" id="vdepoPlay"><span class="pb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="vlbl">Toque para assistir</span></div>'
      +'<div class="vprog"><i id="vdepoBar"></i></div>';
    page.appendChild(card);

    var btn=document.createElement('button'); btn.className='vlock'; btn.disabled=true;
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> <span id="vdepoTxt">Assista o depoimento para continuar</span>';
    page.appendChild(btn);
    scrollPage(host);

    var v=card.querySelector('#vdepoV'), bar=card.querySelector('#vdepoBar');
    var overlay=card.querySelector('#vdepoPlay'), txt=btn.querySelector('#vdepoTxt');
    var liberou=false;
    function liberar(){
      if(liberou) return; liberou=true;
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg> Continuar';
    }
    function tocar(){ if(v.paused){ var p=v.play(); if(p&&p.catch)p.catch(function(){}); } else { v.pause(); } }
    overlay.onclick=tocar; v.onclick=tocar;
    v.addEventListener('play', function(){ card.classList.add('playing'); });
    v.addEventListener('pause', function(){ if(!v.ended) card.classList.remove('playing'); });
    v.addEventListener('timeupdate', function(){
      var d=v.duration||1, pct=Math.min(100, v.currentTime/d*100);
      bar.style.width=pct+'%';
      if(!liberou){
        var rest=Math.max(0, Math.ceil(d - v.currentTime));
        txt.textContent='Assista o depoimento · faltam '+rest+'s';
        if(v.currentTime >= d*0.85) liberar();
      }
    });
    v.addEventListener('ended', function(){ card.classList.remove('playing'); overlay.style.display='none'; liberar(); });

    /* Rede de segurança: se o vídeo não carregar (rede ruim, arquivo fora do ar),
       libera o botão em 12s. Prender a pessoa num vídeo que nunca vai tocar é
       perder a venda — o depoimento é reforço, não pedágio. */
    setTimeout(function(){ if(!liberou && (v.readyState===0 || v.error)) liberar(); }, 12000);
    v.addEventListener('error', liberar);

    btn.onclick=function(){
      if(btn.disabled) return;
      try{ v.pause(); }catch(e){}
      echoOut(page, 'Assisti ✅');
      setTimeout(function(){ done&&done(); }, 460);
    };
  }
}
/* ====== VÍDEO DE ABERTURA: a atendente pede pra assistir ANTES de tudo ======
   Só depois de assistir (o vídeo é curto) o chat segue pra confirmação dos dados.

   RITMO (é o ponto): a pessoa cai no chat e NÃO leva o vídeo na cara. Primeiro ela
   vê a conversa vazia, aí a Fernanda aparece "digitando" alguns segundos, manda a
   primeira mensagem, dá um respiro pra ela ler, volta a "digitar" e SÓ ENTÃO o
   vídeo chega — como chegaria no WhatsApp de verdade. Despejar tudo de uma vez
   entrega que é página, não conversa. */
function videoIntro(done){
  var page=document.createElement('div');

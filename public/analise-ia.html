  swapPage(page);
  var host=page.querySelector('.qtop');
  var myGen=gen;
  function alive(){ return myGen===gen; }

  var abertura='Oi'+(oi?(', '+oi):'')+'! 💛 Antes da gente começar, **dá play nesse vídeo** 👇 Assiste até o fim que eu já te explico como você recebe o seu dinheiro.';

  /* 1) "digitando…" → 2) a mensagem → 3) respiro pra ler → 4) "digitando…" de novo → 5) o vídeo */
  typeMessages(page, [abertura], function(){
    if(!alive()) return;
    setTimeout(function(){
      if(!alive()) return;
      var tp=document.createElement('div'); tp.className='qrow';
      tp.innerHTML='<div class="mav ghost"><img src="'+AV+'" alt=""></div>'
        +'<div class="bubble typing-b"><span class="typing"><span></span><span></span><span></span></span></div>';
      host.appendChild(tp); scrollPage(host);
      setTimeout(function(){
        if(!alive()) return;
        if(tp.parentNode) tp.parentNode.removeChild(tp);
        montarVideo();
        SFX.recv();
      }, 2100);
    }, 1500);
  });

  function montarVideo(){
    var card=document.createElement('div'); card.className='vintro';
    card.innerHTML=''
      +'<div class="vbadge"><img src="images/credfacil-logo.png" alt="CredFácil"><b>ASSISTA</b></div>'
      +'<video id="vintroV" src="videos/video-credfacil-1.mp4" poster="videos/video-credfacil-1-poster.jpg" playsinline preload="metadata"></video>'
      +'<div class="vplay" id="vintroPlay"><span class="pb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="vlbl">Toque para assistir</span></div>'
      +'<div class="vprog"><i id="vintroBar"></i></div>';
    page.appendChild(card);

    var btn=document.createElement('button'); btn.className='vlock'; btn.disabled=true;
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> <span id="vlockTxt">Assista o vídeo para continuar</span>';
    page.appendChild(btn);
    scrollPage(page.querySelector('.qtop'));

    var v=card.querySelector('#vintroV'), bar=card.querySelector('#vintroBar');
    var overlay=card.querySelector('#vintroPlay'), txt=btn.querySelector('#vlockTxt');
    var liberou=false;
    function liberar(){
      if(liberou) return; liberou=true;
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg> Continuar';
    }
    function tocar(){ if(v.paused){ var p=v.play(); if(p&&p.catch)p.catch(function(){}); } else { v.pause(); } }
    overlay.onclick=tocar; v.onclick=tocar;
    v.addEventListener('play', function(){ card.classList.add('playing'); });
    v.addEventListener('pause', function(){ if(!v.ended) card.classList.remove('playing'); });
    v.addEventListener('timeupdate', function(){
      var d=v.duration||1, pct=Math.min(100, v.currentTime/d*100);
      bar.style.width=pct+'%';
      if(!liberou){
        var rest=Math.max(0, Math.ceil(d - v.currentTime));
        txt.textContent='Assista o vídeo · faltam '+rest+'s';
        if(v.currentTime >= d*0.85) liberar();   /* assistiu quase tudo → libera */
      }
    });
    v.addEventListener('ended', function(){ card.classList.remove('playing'); overlay.style.display='none'; liberar(); });

    btn.onclick=function(){
      if(btn.disabled) return;
      try{ v.pause(); }catch(e){}
      echoOut(page, 'Já assisti ✅');
      setProg();
      setTimeout(function(){ done&&done(); }, 460);
    };
  }
}

/* ============ OFERTA (calcula com VÁRIOS fatores) ============ */
function rendaTxt(){ var r=Number(answers.renda)||0;
  if(r<=1300)return 'cerca de R$ 1.500'; if(r<=2300)return 'entre R$ 1.500 e R$ 3.000';
  if(r<=4000)return 'entre R$ 3.000 e R$ 5.000'; if(r<=7500)return 'acima de R$ 5.000'; return 'acima de R$ 10.000'; }
function calcAprovado(){
  var renda=Number(answers.renda)||2300, max=renda*6;
  if(answers.negativado==='sim') max*=0.55;
  if(answers.finalidade==='negocio'){ max*=1.12; if(answers.fatura==='+15')max*=1.15; if(answers.fatura==='ate5')max*=0.9; }
  if(answers.finalidade==='reforma'){ max*=1.05; if(answers.imovel==='proprio')max*=1.08; }
  if(answers.finalidade==='dividas'){ if(answers.valordivida==='+10k')max*=0.9; if(answers.pagaminimo==='nao')max*=0.85; }
  if(answers.finalidade==='medica' && answers.temparte==='sim') max*=1.05;
  var occ=answers.ocupacao_key;
  if(occ==='publico'||occ==='aposentado') max*=1.10;
  if(occ==='clt'){ if(answers.tempo_emprego==='estavel') max*=1.06; else if(answers.tempo_emprego==='novo') max*=0.96; }
  if(occ==='empresario' && answers.cnpj==='sim') max*=1.05;
  if(occ==='autonomo' && answers.estab_renda==='varia') max*=0.93;
  if(occ==='desempregado') max*=0.62;
  var esc=escolaridadeTxt(); if(esc==='ensino superior'||esc==='pós-graduação') max*=1.04;
  /* teto do PRÉ-APROVADO (só o que aparece no slider pra ela escolher).
     Pode passar de 5k pra ela poder pedir mais alto, mas o que é LIBERADO de fato
     (calcLiberado, após o Serasa) é sempre travado abaixo de 5k. */
  max=Math.min(8000,max); max=Math.max(2000,Math.round(max/500)*500);
  return max;
}
/* patrimônio: veio da etapa 6 da página 3 */
function bensTxt(){ return {proprio:'imóvel próprio', veiculo:'veículo', ambos:'imóvel e veículo'}[answers.bens]||''; }

/* Síntese ENXUTA. Antes eram 8 balões, vários com 3 linhas cada — a pessoa
   não lê parede de texto no celular. Agora são 4, curtos e diretos. */
function buildSynthesis(){
  var f=answers.finalidade, neg=answers.negativado==='sim';
  var m=['Pronto'+(oi?(', '+oi):'')+'! Li tudo com calma 💚'];

  /* o recap cabe em UMA frase */
  var recap;
  if(f==='dividas'){
    var vd={ate2k:'de até R$ 2 mil','2a5k':'de R$ 2 a 5 mil','5a10k':'de R$ 5 a 10 mil','+10k':'acima de R$ 10 mil'}[answers.valordivida]||'';
    recap='Você quer **quitar uma dívida '+vd+'**, ganhando '+rendaTxt()+' por mês.';
  } else if(f==='medica'){
    recap='É uma **emergência médica** '+(answers.urgencia==='agora'?'pra agora':'pros próximos dias')+', com renda de '+rendaTxt()+'.';
  } else if(f==='reforma'){
    recap='É pra **reformar o seu imóvel**, com renda de '+rendaTxt()+'.';
  } else if(f==='negocio'){
    recap='É pro **seu negócio**, com renda de '+rendaTxt()+'.';
  } else {
    recap='É pro **seu objetivo**, com renda de '+rendaTxt()+'.';
  }
  m.push(recap);

  /* o que pesou a favor — uma linha só, e só se existir algo de verdade.
     Aqui entra o patrimônio, que é a pergunta nova da página anterior. */
  var favor=[];
  if(ocupacaoTxt()) favor.push('você é '+ocupacaoTxt());
  if(bensTxt()) favor.push('tem '+bensTxt()+' no seu nome');
  if(favor.length){
    m.push('Pesou a favor: '+favor.join(' e ')+'.'+(neg?' E o nome negativado não travou nada aqui.':''));
  } else if(neg){
    m.push('E pode ficar tranquila: nome negativado não travou nada aqui 💚');
  }

  m.push('Consegui uma condição especial pra você — **PRÉ-APROVADO(A)**! 🎉 Posso liberar de '+brl(2000)+' até **'+brl(calcAprovado())+'**. Quanto você quer solicitar? 👇');
  return m;
}

/* ---- helpers de cálculo ---- */
var JUROS=0.0081;
function parcelaDe(amount,n){ var r=JUROS; return amount*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); }
function brl2(v){ return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function capMes(d){ var s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtData(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }

/* nova página de etapa da oferta: bolha curta da Fernanda + monta o conteúdo */
function offerStep(msgs, build){
  var page=document.createElement('div'); page.innerHTML='<div class="qtop"></div>';
  swapPage(page);
  typeMessages(page, msgs, function(){ build(page); });
}

/* ====== ETAPA 1: SOLICITAR o valor desejado (sem chips) ====== */
/* ===== TETO por perfil =====
   Quem tem restrição fica numa faixa mais curta; quem está limpo vai bem mais
   alto. É o que decide o tamanho das três propostas. */
function tetoProposta(){
  var t=calcAprovado();
  if(answers.negativado==='sim') t=Math.max(5200, Math.min(t*1.25, 7600));
  else                           t=Math.max(9000, Math.min(t*1.15, 26000));
  return Math.round(t);
}

/* semente estável a partir do CPF: os valores não podem mudar se ela recarregar */
function sementeCPF(){
  var d=''; try{ d=(localStorage.getItem('cpf')||'').replace(/\D/g,''); }catch(e){}
  var s=0; for(var i=0;i<d.length;i++) s+=parseInt(d[i],10)*(i+2);
  return s||37;
}
/* tira o "ar de tabela": valor redondo parece preço de catálogo, não análise */
function quebrar(v, extra){
  v=Math.round(v/10)*10;
  var j=((sementeCPF()+extra)%83)+11;
  return Math.max(600, v-j);
}

function tresPropostas(){
  var teto=tetoProposta();
  return [
    { nome:'Parcela mais leve',    valor:quebrar(teto*0.34, 3),  prazo:12 },
    { nome:'Mais escolhida',       valor:quebrar(teto*0.62, 17), prazo:18, destaque:true },
    { nome:'Valor máximo liberado',valor:quebrar(teto*1.00, 41), prazo:24 }
  ];
}

/* ====== valor LIBERADO conforme o perfil (análise rigorosa) ======
   Regra travada: o valor liberado após o Serasa é SEMPRE abaixo de R$ 5.000,
   varia por perfil (renda, negativado, ocupação, finalidade) e nunca é redondo. */
/* O teto agora acompanha o PERFIL — não é mais travado em 4.900.
   As três propostas já saem do perfil dela; se o teto continuasse fixo, quem
   escolhesse a proposta máxima receberia bem menos, e a tela anterior viraria
   mentira na cara dela. */
/* A análise do perfil agora acontece ANTES, ao montar as três propostas:
   os valores já saem calculados da renda, da ocupação e da situação do CPF.
   Então o que ela escolhe é o que ela recebe.

   O corte por "confiança" que existia aqui foi removido de propósito: com as
   propostas na tela, reduzir o valor depois faria a tela anterior virar isca
   (ela escolhia R$ 5.117 e recebia R$ 1.563 — foi o que o teste mostrou). */
function calcLiberado(pedido){
  var teto=tetoProposta();
  var lib=Math.min(Number(pedido)||0, teto);
  return Math.max(600, Math.round(lib));
}

/* Quais prazos oferecer — antes eram sempre os 6 (12 a 60x), o que não
   conversava com a proposta que ela acabou de escolher nem com o perfil.
   Agora sai do prazo escolhido, com um mais curto e alguns mais longos. */
function planosDisponiveis(){
  var escolhido=Number(answers.prazo_escolhido)||18;
  var teto=(answers.negativado==='sim') ? 36 : 60;   // perfil restrito, prazo menor
  var todos=[12,18,24,36,48,60].filter(function(n){ return n<=teto; });
  if(todos.indexOf(escolhido)<0) todos.push(escolhido);
  todos.sort(function(a,b){ return a-b; });

  var i=todos.indexOf(escolhido);
  var ini=Math.max(0, i-1);                          // um mais curto que o dela
  var lista=todos.slice(ini, ini+4);                 // no máximo 4 opções
  if(lista.indexOf(escolhido)<0) lista.unshift(escolhido);
  return lista;
}

/* ============================================================
   CONTRATO — a pessoa LE tudo, depois assina.
   Antes ela assinava no escuro e so entao via as clausulas; era
   assinar primeiro e ler depois, que e o contrario do que um
   contrato tem que ser.
   ============================================================ */
/* ===== CONTRATO: número, cronograma e cláusulas ===== */
function numeroContrato(){
  var d=(getCPF()||'').replace(/\D/g,''), h=new Date();
  var base=(d.slice(0,3)||'000')+(d.slice(3,6)||'000');
  return base+((parseInt(d.slice(-4),10)||1234)%9999+1000);
}
function codigoAutenticacao(valor,n){
  var s=(getCPF()||'')+'|'+valor+'|'+n+'|'+new Date().toDateString();
  var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
  var hex=Math.abs(h).toString(16).toUpperCase();
  while(hex.length<8) hex='0'+hex;
  var t=Math.abs(h*31%99999).toString(16).toUpperCase();
  while(t.length<5) t='0'+t;
  return hex.slice(0,4)+'-'+hex.slice(4,8)+'-'+t;
}
/* datas de vencimento de cada parcela */
function cronograma(valor,n){
  var m=parcelaDe(valor,n);
  var diaPref=parseInt(new URLSearchParams(location.search).get('paymentDay'),10);
  var hoje=new Date();
  var dia=(diaPref>=1&&diaPref<=28)?diaPref:Math.min(hoje.getDate(),28);
  var linhas=[];
  for(var i=1;i<=n;i++){
    var d=new Date(hoje.getFullYear(), hoje.getMonth()+i, dia);
    linhas.push({ n:i, data:fmtData(d), valor:m });
  }
  return linhas;
}

/* acentuado tem a MESMA largura da letra base na Helvetica */
var PDF_BASE={'á':'a','à':'a','â':'a','ã':'a','ä':'a','é':'e','ê':'e','è':'e','í':'i','ì':'i','î':'i','ó':'o','ô':'o','õ':'o','ò':'o','ú':'u','ù':'u','û':'u','ü':'u','ç':'c','ñ':'n','Á':'A','À':'A','Â':'A','Ã':'A','É':'E','Ê':'E','Í':'I','Ó':'O','Ô':'O','Õ':'O','Ú':'U','Ç':'C'};
/* pontuação fora do Latin-1: vira o byte certo do WinAnsi */
var PDF_WIN={'–':0x96,'—':0x97,'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'•':0x95,'…':0x85};

function pdfLargura(s, tam, neg){
  var t=neg?PDF_W_NEG:PDF_W_REG, soma=0;
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i), cod=s.charCodeAt(i);
    if(c==='º'||c==='ª'||c==='°'){ soma+=350; continue; }
    if(PDF_WIN[c]!==undefined){ soma+=(c==='–'||c==='—')?556:222; continue; }
    if(PDF_BASE[c]) { c=PDF_BASE[c]; cod=c.charCodeAt(0); }
    soma += (cod>=32&&cod<=126) ? t[cod-32] : 556;
  }
  return soma*tam/1000;
}
/* texto -> bytes WinAnsi, com os parênteses escapados */
function pdfEsc(s){
  var out='';
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i), cod=s.charCodeAt(i);
    if(PDF_WIN[c]!==undefined) cod=PDF_WIN[c];
    else if(cod>255) cod=63; /* '?' — nada fora do WinAnsi entra no arquivo */
    if(cod===40||cod===41||cod===92) out+='\\';
    out+=String.fromCharCode(cod);
  }
  return out;
}
function pdfMontar(paginas){
  var L=595.28, A=841.89, objs=[], i;
  var idPag=[], idCont=[];
  for(i=0;i<paginas.length;i++){ idPag.push(5+i*2); idCont.push(6+i*2); }
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Count '+paginas.length+' /Kids ['+idPag.map(function(id){return id+' 0 R';}).join(' ')+'] >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for(i=0;i<paginas.length;i++){
    objs[idPag[i]]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+L.toFixed(2)+' '+A.toFixed(2)+']'
      +' /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+idCont[i]+' 0 R >>';
    var fluxo=paginas[i].join('\n');
    objs[idCont[i]]='<< /Length '+fluxo.length+' >>\nstream\n'+fluxo+'\nendstream';
  }
  var arq='%PDF-1.4\n%âãÏÓ\n', pos=[];
  for(var id=1; id<objs.length; id++){
    if(objs[id]===undefined) continue;
    pos[id]=arq.length;
    arq+=id+' 0 obj\n'+objs[id]+'\nendobj\n';
  }
  var inicio=arq.length, total=objs.length;
  arq+='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(id=1; id<total; id++){
    var p=String(pos[id]||0); while(p.length<10) p='0'+p;
    arq+=p+' 00000 n \n';
  }
  arq+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+inicio+'\n%%EOF';
  var bytes=new Uint8Array(arq.length);
  for(i=0;i<arq.length;i++) bytes[i]=arq.charCodeAt(i)&0xFF;
  return new Blob([bytes], {type:'application/pdf'});
}

function pdfContrato(d, sigTracos){

  var CINZA='0.541 0.514 0.470', TINTA='0.082 0.141 0.106', BRANCO='1 1 1', VERDE='0.059 0.420 0.247';
  var paginas=[], cmd=null, y=0, nPag=0;
  function f(v){ return (Math.round(v*100)/100).toString(); }
  function ret(x,topo,w,h,cor){ cmd.push(cor+' rg', f(x)+' '+f(A-topo-h)+' '+f(w)+' '+f(h)+' re f'); }
  function txt(x,base,s,tam,neg,cor){
    cmd.push('BT '+(cor||TINTA)+' rg /'+(neg?'F2':'F1')+' '+f(tam)+' Tf 1 0 0 1 '+f(x)+' '+f(A-base)+' Tm ('+pdfEsc(s)+') Tj ET');
  }
  function txtDir(xd,base,s,tam,neg,cor){ txt(xd-pdfLargura(s,tam,neg),base,s,tam,neg,cor); }
  function txtCen(xc,base,s,tam,neg,cor){ txt(xc-pdfLargura(s,tam,neg)/2,base,s,tam,neg,cor); }
  function reta(x1,b1,x2,b2,cor,esp,tracejada){
    cmd.push((cor||'0.94 0.93 0.91')+' RG', f(esp||0.6)+' w', tracejada?'[1 2] 0 d':'[] 0 d',
             f(x1)+' '+f(A-b1)+' m '+f(x2)+' '+f(A-b2)+' l S', '[] 0 d');
  }
  function quebrar(s,tam,neg,larg){
    var pal=s.split(' '), linhas=[], atual='';
    for(var i=0;i<pal.length;i++){
      var teste=atual?(atual+' '+pal[i]):pal[i];
      if(pdfLargura(teste,tam,neg)>larg && atual){ linhas.push(atual); atual=pal[i]; }
      else atual=teste;
    }
    if(atual) linhas.push(atual);
    return linhas;
  }
  function rodape(){
    reta(ME,A-52,L-ME,A-52,'0.90 0.88 0.85',0.6);
    txt(ME,A-38,'Contrato nº '+d.num+' · Autenticação '+d.auth,7,false,CINZA);
    txtDir(L-ME,A-38,'Página '+nPag,7,false,CINZA);
  }
  function novaPagina(){
    if(cmd) rodape();
    cmd=[]; paginas.push(cmd); nPag++;
    ret(0,0,L,74,GRAF);
    ret(0,74,L,3.5,AMBAR);
    txt(ME,34,'CredFácil',18,true,BRANCO);
    txt(ME,50,'Crédito Digital',8,false,'1.0 0.714 0.353');
    txtDir(L-ME,32,'CONTRATO Nº '+d.num,8.5,true,BRANCO);
    txtDir(L-ME,46,'Emitido em '+d.data,8,false,'0.784 0.757 0.706');
    y=110;
  }
  function espaco(h){ if(y+h>A-64) novaPagina(); }

  function secao(t){
    espaco(46); y+=14;
    txt(ME,y,t.toUpperCase(),8.5,true,AMB_ESC);
    reta(ME,y+5,ME+pdfLargura(t.toUpperCase(),8.5,true),y+5,AMBAR,1.6);
    y+=16;
  }
  function kv(k,v){
    espaco(20);
    txt(ME,y,k,9.5,false,CINZA);
    txtDir(L-ME,y,v,9.5,true,TINTA);
    reta(ME,y+5,L-ME,y+5,'0.93 0.91 0.88',0.5,true);
    y+=17;
  }
  function paragrafo(titulo,corpo,tam){
    tam=tam||8.8;
    var lh=tam*1.55;
    /* o título em negrito começa na mesma linha do texto */
    var largT=pdfLargura(titulo+' ',tam,true);
    var primeira=quebrar(corpo,tam,false,LU-largT)[0]||'';
    var resto=corpo.slice(primeira.length).replace(/^\s+/,'');
    var linhas=resto?quebrar(resto,tam,false,LU):[];
    espaco(lh*(linhas.length+1)+8);
    txt(ME,y,titulo,tam,true,TINTA);
    txt(ME+largT,y,primeira,tam,false,'0.400 0.365 0.318');
    y+=lh;
    for(var i=0;i<linhas.length;i++){ espaco(lh); txt(ME,y,linhas[i],tam,false,'0.400 0.365 0.318'); y+=lh; }
    y+=5;
  }

  novaPagina();

  /* título */
  txt(ME,y,'TERMO DE CONTRATAÇÃO DE EMPRÉSTIMO PESSOAL',13,true,GRAF);
  y+=16;
  txt(ME,y,'Documento gerado eletronicamente em '+d.data+' às '+d.hora,8.5,false,CINZA);
  y+=10;
  reta(ME,y,L-ME,y,'0.90 0.88 0.85',0.8);
  y+=6;

  secao('Identificação do contratante');
  kv('Nome completo', d.nome);
  kv('CPF', d.cpf);
  if(d.nasc && d.nasc!=='—') kv('Data de nascimento', d.nasc);
  kv('E-mail', d.email);
  kv('Telefone', d.fone);
  if(d.endereco) kv('Endereço', d.endereco);

  secao('Identificação da credora');
  kv('Razão social','CredFácil Solicitações de Empréstimos');
  kv('CNPJ','15.484.329/0001-42');

  secao('Condições financeiras');
  kv('Valor liberado', brl2(d.valor));
  kv('Quantidade de parcelas', d.n+'x');
  kv('Valor de cada parcela', brl2(d.parcela));
  kv('Total a pagar', brl2(d.total));
  kv('Total de juros', brl2(d.juros));
  kv('Taxa de juros', d.taxaMes);
  kv('Taxa de juros anual', d.taxaAno);
  kv('Custo Efetivo Total (CET)', d.cet);
  kv('Forma de liberação', d.recebe+(d.banco?(' · '+d.banco):''));

  secao('Cronograma de pagamento');
  var colP=ME, colV=ME+120, colR=L-ME;
  function cabTab(){
    espaco(30);
    ret(ME,y-9,LU,17,'0.969 0.957 0.925');
    txt(colP+6,y+2,'PARCELA',7.5,true,CINZA);
    txt(colV,y+2,'VENCIMENTO',7.5,true,CINZA);
    txtDir(colR-6,y+2,'VALOR',7.5,true,CINZA);
    y+=20;
  }
  cabTab();
  for(var i=0;i<d.cron.length;i++){
    if(y+16>A-64){ novaPagina(); cabTab(); }
    var p=d.cron[i];
    if(i%2===1) ret(ME,y-8,LU,15,'0.988 0.980 0.961');
    txt(colP+6,y,('0'+p.n).slice(-2)+'/'+d.n,9,true,TINTA);
    txt(colV,y,p.data,9,false,'0.400 0.365 0.318');
    txtDir(colR-6,y,brl2(p.valor),9,true,TINTA);
    reta(ME,y+5,L-ME,y+5,'0.95 0.94 0.92',0.4);
    y+=15;
  }
  espaco(24);
  ret(ME,y-8,LU,18,'0.996 0.973 0.910');
  txt(colP+6,y+1,'TOTAL A PAGAR',8,true,AMB_ESC);
  txtDir(colR-6,y+1,brl2(d.total),9.5,true,AMB_ESC);
  y+=22;

  secao('Cláusulas');
  for(i=0;i<d.clausulas.length;i++) paragrafo(d.clausulas[i][0], d.clausulas[i][1]);

  /* assinaturas */
  espaco(160);
  secao('Assinatura das partes');
  y+=6;
  var boxL=(LU-24)/2, boxA=58;
  var x1=ME, x2=ME+boxL+24;

  /* traço da assinatura da contratante, em vetor */
  if(sigTracos && sigTracos.length){
    cmd.push('0.086 0.196 0.290 RG','1.4 w','1 J','1 j');
    for(i=0;i<sigTracos.length;i++){
      var tr=sigTracos[i];
      if(!tr || tr.length<2) continue;
      var seg=[];
      for(var k=0;k<tr.length;k++){
        var px=x1+8+tr[k][0]*(boxL-16), py=A-(y+4+tr[k][1]*(boxA-10));
        seg.push(f(px)+' '+f(py)+(k===0?' m':' l'));
      }
      cmd.push(seg.join(' ')+' S');
    }
    cmd.push('[] 0 d');
  }
  /* rubrica da credora */
  txt(x2+10,y+boxA-20,'CredFácil',15,true,'0.851 0.431 0.031');

  y+=boxA+4;
  reta(x1,y,x1+boxL,y,'0.60 0.57 0.52',0.8);
  reta(x2,y,x2+boxL,y,'0.60 0.57 0.52',0.8);
  y+=12;
  txtCen(x1+boxL/2,y,d.nome,9,true,TINTA);
  txtCen(x2+boxL/2,y,'CredFácil',8,true,TINTA);
  y+=11;
  txtCen(x1+boxL/2,y,'CONTRATANTE · CPF '+d.cpf,7.5,false,CINZA);
  txtCen(x2+boxL/2,y,'CREDORA · CNPJ 15.484.329/0001-42',7.5,false,CINZA);
  y+=11;
  if(sigTracos && sigTracos.length){
    txtCen(x1+boxL/2,y,'Assinado eletronicamente em '+d.data+' às '+d.hora,7.5,false,CINZA);
  }
  y+=18;

  /* selo */
  espaco(56);
  ret(ME,y-10,LU,26,'0.918 0.969 0.937');
  txtCen(L/2,y+6,'DOCUMENTO ASSINADO ELETRONICAMENTE · MP Nº 2.200-2/2001',8,true,VERDE);
  y+=32;
  txtCen(L/2,y,'Código de autenticação: '+d.auth,8,true,CINZA);
  y+=12;
  txtCen(L/2,y,'Verifique a autenticidade informando o nº do contrato e o código acima.',7.5,false,CINZA);

  rodape();
  return pdfMontar(paginas);
}

/* guarda o PDF gerado pra não remontar a cada clique */

function urlDoPDF(d, tracos){
  if(!CT_PDF) CT_PDF=URL.createObjectURL(pdfContrato(d, tracos));
  return CT_PDF;
}

    +kv('CPF', d.cpf)
    +(d.nasc&&d.nasc!=='—'?kv('Nascimento', d.nasc):'')
    +kv('E-mail', d.email)
    +kv('Telefone', d.fone)
    +(d.endereco?kv('Endereço', d.endereco):'')

  +'<div class="ct-sec"><div class="ct-h">Condições financeiras</div>'

  +'<div class="ct-sec"><div class="ct-h">Cláusulas</div>'
    +d.clausulas.map(function(c){ return '<div class="ct-cl"><b>'+c[0]+'</b> '+c[1]+'</div>'; }).join('')

      +(sigImg?'<img src="'+sigImg+'" alt="assinatura">':'<span class="dica">Assine no campo abaixo</span>')
    +'</div>'
    +'<div class="ct-qnome"><div class="n">'+d.nome+'</div><div class="c">CONTRATANTE</div></div>'

}

      +'<div class="ct-folha" id="ctFolha">'+htmlContrato(d, null)
        +'<div class="ct-acoes" id="ctAcoes">'
          +'<button class="ct-btn escuro" id="ctAssinar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> ASSINAR COM O DEDO</button>'
          +'<button class="ct-btn" id="ctGerar" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> GERAR CONTRATO</button>'
          +'<div class="ct-aviso" id="ctAviso">Assine acima para liberar o botão</div>'
          +'<div class="ct-seg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            +'<span>Ambiente seguro. Depois de gerar, você poderá visualizar e baixar a sua via assinada em PDF.</span></div>'
        +'</div>'
      +'</div>'
      +'<div class="ct-rodape"><b>A CredFácil não cobra nenhum tipo de taxa antecipada para a liberação do crédito.</b> '
        +'Se alguém pedir pagamento antes, desconfie: é golpe.<br><br>'

  document.body.appendChild(tela);
  tela.scrollTop=0;

  var btGerar=tela.querySelector('#ctGerar');
  var aviso=tela.querySelector('#ctAviso');

  function ligarMais(){
    var bt=folha.querySelector('#ctMais');
    if(!bt) return;
    bt.onclick=function(){
      var ocultas=folha.querySelectorAll('.ct-oculta');
      for(var i=0;i<ocultas.length;i++) ocultas[i].style.display='';
      bt.remove();
    };
  }
  ligarMais();

  function fechar(){ if(tela.parentNode) tela.parentNode.removeChild(tela); }
  tela.querySelector('#ctVolta').onclick=fechar;

    var quadro=folha.querySelector('#ctQuadro');

    setTimeout(function(){ telaGerado(); }, 1400);

  function telaGerado(){
    try{ localStorage.setItem('cf_contrato','assinado'); }catch(e){}
    setProg && setProg();
    folha.innerHTML=''
      +'<div class="ct-ok">'
        +'<div class="selo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'

        +'<p>O seu contrato nº <b>'+d.num+'</b> foi gerado e assinado digitalmente em '+d.data+'. Visualize ou baixe a sua via em PDF abaixo.</p>'

        +'</div>'
        +'<div class="ct-acoes">'
          +'<button class="ct-btn escuro" id="ctVer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg> VISUALIZAR CONTRATO</button>'
          +'<button class="ct-btn vazio" id="ctBaixar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> BAIXAR MINHA VIA EM PDF</button>'
          +'<button class="ct-btn" id="ctSeguir">CONTINUAR E RECEBER O PIX <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
          +'<div class="ct-seg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
            +'<span>Guarde a sua via em PDF: ela comprova a aprovação do crédito e a assinatura do contrato.</span></div>'
        +'</div>'
      +'</div>';
    tela.scrollTop=0;

    folha.querySelector('#ctVer').onclick=function(){ verPDF(); };
    folha.querySelector('#ctBaixar').onclick=function(){
      var a=document.createElement('a');
      a.href=urlDoPDF(d, sigTracos);
      a.download='contrato-credfacil-'+d.num+'.pdf';
      document.body.appendChild(a); a.click(); a.remove();
    };
    folha.querySelector('#ctSeguir').onclick=function(){
      fechar();
      aoConcluir && aoConcluir(d);
    };
  }

  /* visualizador do PDF, em cima da folha */
  function verPDF(){
    var v=document.createElement('div'); v.className='ct-visor';
    v.innerHTML=''
      +'<div class="ct-vtopo">'
        +'<button class="ct-vvolta" id="ctVFechar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Voltar</button>'
        +'<span>CONTRATO Nº '+d.num+'</span>'
      +'</div>'
      +'<iframe src="'+urlDoPDF(d, sigTracos)+'" title="Contrato em PDF"></iframe>';
    document.body.appendChild(v);
    v.querySelector('#ctVFechar').onclick=function(){ v.remove(); };
  }
}

/* ============================================================
   O PASSO NA CONVERSA — a Fernanda manda o contrato
   ============================================================ */
function contratoFlow(valor, n){
  offerStep([
    'Falta só **um passo**'+(oi?(', '+oi):'')+' 💚 Preparei aqui o seu **contrato**, já com os seus dados e o cronograma das parcelas.',
    'Dá uma lida com calma e, quando estiver de acordo, é só **assinar com o dedo** 📝'
  ], function(p){ appendSignPad(p, valor, n); });
}

/* cartão no chat que abre o documento em tela cheia */
function appendSignPad(page, valor, n){
  var d=dadosContrato(valor, n, null);
  var card=document.createElement('div'); card.className='ctr-conv';
  card.innerHTML=''
    +'<div class="cc-top">'
      +'<div class="cc-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v6h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>'
      +'<div><div class="cc-nome">Contrato de empréstimo pessoal</div>'
        +'<div class="cc-sub">'+brl(valor)+' · '+n+'x · Contrato nº '+d.num+'</div></div>'
    +'</div>'
    +'<button class="cc-abrir" id="ctAbrir"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Ler e assinar o contrato</button>'
    +'<div class="cc-pe">Assinatura eletrônica com validade jurídica — MP 2.200-2/2001</div>';
  page.appendChild(card);
  scrollPage(page.querySelector('.qtop'));

  card.querySelector('#ctAbrir').onclick=function(){
    abrirTelaContrato(valor, n, function(){
      var bt=card.querySelector('#ctAbrir');
      bt.disabled=true;
      bt.style.background='#eaf7ef'; bt.style.color='#0f6b3f'; bt.style.boxShadow='none';
      bt.innerHTML='✓ Contrato assinado';
      try{ localStorage.setItem('cf_contrato','aceito'); }catch(e){}
      var q=new URLSearchParams(window.location.search);
      window.location.href='6.html'+(q.toString()?'?'+q:'');
    });
  };
}

/* tela cheia da assinatura (o quadro ampliado) */
function abrirTelaAssinatura(nomeSugerido, aoAssinar){
  var tela=document.createElement('div'); tela.className='sig-tela';
  tela.innerHTML=''
    +'<div class="sig-topo">'
      +'<button class="volta" id="sigVolta" aria-label="voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m15 6-6 6 6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
      +'<div><b>Assinatura do contrato</b><small>Use o dedo na tela</small></div>'
    +'</div>'
    +'<div class="sig-corpo">'
      +'<div class="sig-instr">Assine no quadro abaixo, do jeito que você assina no papel.</div>'
      +'<div class="sig-area" id="sigArea">'
        +'<canvas id="sigCanvas"></canvas>'
        +'<div class="sig-linha"></div>'
        +'<button type="button" class="sig-limpar" id="sigClear">Limpar</button>'
      +'</div>'
      +'<input class="sig-nome" id="sigName" type="text" autocomplete="name" placeholder="Seu nome completo" value="'+String(nomeSugerido||'').replace(/"/g,'&quot;')+'">'
    +'</div>'
    +'<div class="sig-acoes">'
      +'<button class="sig-ok" id="sigOk" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Confirmar assinatura</button>'
      +'<div class="sig-aviso">Assinatura eletrônica com validade jurídica — MP 2.200-2/2001</div>'
    +'</div>';
  document.body.appendChild(tela);

  var area=tela.querySelector('#sigArea'), canvas=tela.querySelector('#sigCanvas');
  var nameInp=tela.querySelector('#sigName'), btOk=tela.querySelector('#sigOk');
  var ctx=canvas.getContext('2d'), desenhando=false, temTinta=false, ult=null;
  /* alem do PNG, guardo os tracos normalizados: e assim que a assinatura
     entra no PDF como VETOR, sem precisar embutir imagem no arquivo. */
  var tracos=[], tracoAtual=null;
  function normal(p){ var r=canvas.getBoundingClientRect();
    return [Math.max(0,Math.min(1,p.x/r.width)), Math.max(0,Math.min(1,p.y/r.height))]; }

  function ajustar(){
    var dpr=Math.max(1,window.devicePixelRatio||1), r=canvas.getBoundingClientRect();
    var img=temTinta?canvas.toDataURL():null;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#16324a';
    if(img){ var i=new Image(); i.onload=function(){ ctx.drawImage(i,0,0,r.width,r.height); }; i.src=img; }
  }
  setTimeout(ajustar,80);
  window.addEventListener('resize', ajustar);

  function ponto(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function revisar(){ btOk.disabled = !(temTinta && nameInp.value.trim().length>=3 && nameInp.value.trim().indexOf(' ')>0); }

  canvas.addEventListener('pointerdown',function(e){ desenhando=true; ult=ponto(e);
    tracoAtual=[normal(ult)]; e.preventDefault(); try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener('pointermove',function(e){
    if(!desenhando) return;
    var p=ponto(e);
    ctx.beginPath(); ctx.moveTo(ult.x,ult.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ult=p;
    if(tracoAtual) tracoAtual.push(normal(p));
    if(!temTinta){ temTinta=true; area.classList.add('tinta'); revisar(); }
    e.preventDefault();
  });
  function fecharTraco(){ if(tracoAtual && tracoAtual.length>1) tracos.push(tracoAtual); tracoAtual=null; }
  canvas.addEventListener('pointerup',function(){ desenhando=false; fecharTraco(); });
  canvas.addEventListener('pointerleave',function(){ if(desenhando) fecharTraco(); desenhando=false; });

  tela.querySelector('#sigClear').onclick=function(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    temTinta=false; tracos=[]; tracoAtual=null; area.classList.remove('tinta'); revisar();
  };
  nameInp.addEventListener('input', function(){ nameInp.classList.remove('ruim'); revisar(); });

  function fechar(){ window.removeEventListener('resize', ajustar); if(tela.parentNode) tela.parentNode.removeChild(tela); }
  tela.querySelector('#sigVolta').onclick=fechar;

  btOk.onclick=function(){
    var nm=nameInp.value.trim();
    if(!temTinta || nm.length<3 || nm.indexOf(' ')<0){ nameInp.classList.add('ruim'); return; }
    var img=canvas.toDataURL('image/png');
    try{ localStorage.setItem('nome',nm); }catch(e){}
    fechar();
    aoAssinar && aoAssinar(nm, img, tracos.slice());
  };
}

setTimeout(function(){ run(); }, 350);
</script>
